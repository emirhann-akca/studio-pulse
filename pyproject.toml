[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "studio-pulse"
version = "0.2.0"
description = "One data and monitoring system for a small mobile studio: DuckDB warehouse, source connectors, SQL metric models, alerts and a static dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Emirhan Akça" }]
keywords = ["analytics", "mobile", "games", "duckdb", "ga4", "unity", "monitoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "duckdb>=1.3",
  "pyarrow>=15",
  "pyyaml>=6",
  "requests>=2.31",
  # Windows has no IANA time zone database; zoneinfo reads it from tzdata there.
  "tzdata>=2024.1; sys_platform == 'win32'",
  # pulse serve (local UI). htmx is vendored in serve/static, no Node build.
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  # brain: AST guard for SQL the package did not write (MIT, pure-Python wheel)
  "sqlglot>=30.31,<31",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-bigquery>=3.20",
  "google-cloud-storage>=2.14",
  "google-auth>=2.28",
]
# Ad-network APIs (Meta, Google Ads, TikTok) through dlt's REST client. Not
# dlt[duckdb]: that extra pins duckdb < 2 and dlt's loader is not used.
ua = ["dlt>=1.32,<2"]
# App Store Connect API keys (ES256 JWT) for customer reviews.
stores = ["pyjwt[crypto]>=2.8"]
# Seasonality-aware alert bands with Nixtla statsforecast (AutoETS); without it
# forecast_band uses a same-weekday median +- MAD band.
forecast = ["statsforecast>=2.0"]
dev = [
  "pytest>=8",
  "pytest-github-actions-annotate-failures>=0.2",
  "ruff>=0.5",
  "httpx2>=2.9",  # starlette.testclient (httpx is deprecated there since starlette 1.x)
  "tzdata>=2024.1",
  "google-cloud-bigquery>=3.20",
  "google-cloud-storage>=2.14",
  "google-auth>=2.28",
  "dlt>=1.32,<2",
  "pyjwt[crypto]>=2.8",
  # reference implementations the statistics are checked against (tests only)
  "scipy>=1.11",
  "statsmodels>=0.14",
]

[project.scripts]
pulse = "studio_pulse.cli:main"

[project.gui-scripts]
# Windowless launcher for scheduled runs: no console window flashes on Windows.
pulse-bg = "studio_pulse.background:gui_main"

[project.urls]
Homepage = "https://github.com/emirhann-akca/studio-pulse"
Demo = "https://emirhann-akca.github.io/studio-pulse/"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_pulse"]

[tool.hatch.build.targets.wheel.force-include]
"models" = "studio_pulse/_models"
"alerts.yaml" = "studio_pulse/_defaults/alerts.yaml"
"checks.yaml" = "studio_pulse/_defaults/checks.yaml"

[tool.hatch.build.targets.sdist]
include = [
  "src", "models", "tests", "docs/*.md", "alerts.yaml", "checks.yaml", "pulse.example.yaml",
  "install.sh", "install.ps1", "README.md", "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: builds a demo warehouse",
  "forecast: needs the optional statsforecast extra (skipped without it)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/demo", "unity"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
