[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "studio-pulse"
version = "0.1.0"
description = "One data and monitoring system for a small mobile studio: DuckDB warehouse, source connectors, SQL metric models, alerts and a static dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Emirhan Akça" }]
keywords = ["analytics", "mobile", "games", "duckdb", "ga4", "unity", "monitoring"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "duckdb>=1.3",
  "pyarrow>=15",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-bigquery>=3.20",
  "google-cloud-storage>=2.14",
  "google-auth>=2.28",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "google-cloud-bigquery>=3.20",
  "google-cloud-storage>=2.14",
  "google-auth>=2.28",
]

[project.scripts]
pulse = "studio_pulse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_pulse"]

[tool.hatch.build.targets.wheel.force-include]
"models" = "studio_pulse/_models"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/demo", "unity"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
