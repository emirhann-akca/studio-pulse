name: studio_pulse_perf
description: >-
  Frame-time, start-time and memory telemetry for Flutter apps, emitting the
  studio-pulse event contract (pulse_perf / pulse_load) to Firebase Analytics
  or JSON lines.
version: 0.1.0
publish_to: none
repository: https://github.com/emirhann-akca/studio-pulse

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
