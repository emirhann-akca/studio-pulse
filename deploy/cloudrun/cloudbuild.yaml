# gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml --substitutions _IMAGE=<region>-docker.pkg.dev/<project>/<repo>/pulse-collector:<tag> .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/cloudrun/Dockerfile", "--build-arg", "GEOIP=${_GEOIP}", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
substitutions:
  _GEOIP: "1"
