# Builds the wheel and sdist when a version tag (v*) is pushed, smoke-tests the
# wheel, and publishes them with the installers and SHA-256 sums as a GitHub
# release. The one-line installers download the wheel from that release, so a
# tag is what makes `install.sh` / `install.ps1` installable for users.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The tag, the package and both installers agree on the version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error title=version mismatch::tag $GITHUB_REF_NAME but pyproject.toml says $v"; exit 1
          fi
          grep -q "VERSION=\"$v\"" install.sh || { echo "::error title=install.sh::VERSION is not $v"; exit 1; }
          grep -q "\$Version = '$v'" install.ps1 || { echo "::error title=install.ps1::Version is not $v"; exit 1; }
      - run: uv build --out-dir dist
      - run: python3 .github/scripts/check_wheel.py dist
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv --python 3.13 /tmp/venv
          uv pip install --python /tmp/venv dist/*.whl
          /tmp/venv/bin/pulse --version
          /tmp/venv/bin/pulse demo --scale 0.05 --workdir /tmp/work --out /tmp/site
          /tmp/venv/bin/pulse check --config /tmp/work/pulse.yaml
      - name: Checksums
        run: cp install.sh install.ps1 dist/ && cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: GitHub release with the wheel, sdist, installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "studio-pulse $GITHUB_REF_NAME" \
            --generate-notes --verify-tag
