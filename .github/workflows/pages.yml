# Publishes the committed synthetic demo (docs/demo) as the site root:
# https://emirhann-akca.github.io/studio-pulse/ serves docs/demo/index.html.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths: ["docs/demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/demo
      - id: deployment
        uses: actions/deploy-pages@v5
