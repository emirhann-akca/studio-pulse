# Tests on Windows, macOS (Apple Silicon) and Linux x Python 3.11-3.13, a real
# user install on each OS through the README's one-liners, the no-release
# fallback of the installers, the optional forecast extra, the Flutter package,
# a real OS schedule round trip, and a check that the demo's model tables agree
# on every job (text and integers exactly, floats within a relative 1e-9; see
# .github/scripts/compare_fingerprints.py). Failures are published
# as annotations (.github/scripts/annotate.py) because job logs need a token.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff>=0.5" "pyyaml>=6"
      - run: ruff check --output-format=github .
      - run: python .github/scripts/annotate.py "ruff format --check" ruff format --check .
      # Event contract v2: every generated file (Python, C#, Dart, JSON Schema, BigQuery,
      # privacy manifest, docs/CONTRACT.md) must equal what contract/pulse_v2.yaml generates.
      - name: Contract outputs are regenerated (no diff)
        run: |
          PYTHONPATH=src python .github/scripts/annotate.py "contract generate" python -m studio_pulse.contract.generate
          python .github/scripts/annotate.py "contract outputs differ from contract/pulse_v2.yaml (run: python -m studio_pulse.contract.generate)" git diff --exit-code

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python .github/scripts/annotate.py "pip install (${{ matrix.os }} py${{ matrix.python }})" python -m pip install -e ".[dev]"
      # An implicit locale encoding is an error on every OS: this is how a
      # cp1254 (Turkish Windows) bug shows up on macOS and Linux too. Failures
      # become annotations through pytest-github-actions-annotate-failures.
      - name: Tests
        run: python -X warn_default_encoding -m pytest -W error::EncodingWarning -p no:cacheprovider
      - name: Demo, data-quality checks and model fingerprint (same encoding gate)
        shell: bash
        run: |
          gate="python -X warn_default_encoding -W error::EncodingWarning -m studio_pulse.cli"
          a="python .github/scripts/annotate.py"
          tag="${{ matrix.os }} py${{ matrix.python }}"
          $a "pulse demo ($tag)" $gate demo --scale 0.2 --out demo-site --workdir .pulse-demo
          $a "pulse check ($tag)" $gate check --config .pulse-demo/pulse.yaml
          $a "pulse fingerprint ($tag)" $gate fingerprint --config .pulse-demo/pulse.yaml --out fingerprint
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fingerprint-${{ matrix.os }}-py${{ matrix.python }}
          path: fingerprint/
          retention-days: 7

  collector-smoke:
    # A real `pulse collect` process, `pulse simulate` posting over HTTP for a minute,
    # /live checked against what was sent, then `pulse run` (while the collector is
    # still writing) and the UI check, on Windows and macOS.
    name: collector + simulator smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python .github/scripts/annotate.py "pip install (${{ matrix.os }})" python -m pip install -e ".[dev]"
      - name: Collector, simulator, /live, refresh and UI
        shell: pwsh
        run: |
          $annotate = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/annotate.py'
          function Run([string]$title) {
            & python $annotate "$title (${{ matrix.os }})" @args
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $work = Join-Path $env:RUNNER_TEMP ('collector ' + [char]0x015E + [char]0x0131 + 'k')
          $out = Join-Path $env:GITHUB_WORKSPACE 'smoke-out'
          New-Item -ItemType Directory -Force $work, $out | Out-Null
          Set-Location -LiteralPath $work
          $today = [DateTime]::UtcNow.ToString('yyyy-MM-dd')
          @(
            'title: CI collector smoke'
            'warehouse: wh.duckdb'
            'site_dir: site'
            'lookback_days: 7'
            "end_date: '$today'"
            "as_of: '$today'"
            'fx_rates: {USD: 1.0, EUR: 1.08, GBP: 1.27, BRL: 0.18, INR: 0.012, TRY: 0.029, MXN: 0.055, JPY: 0.0066, IDR: 0.000063}'
            'collector:'
            '  data_dir: collector'
            '  url: http://127.0.0.1:8787'
          ) | Set-Content -Encoding utf8 pulse.yaml
          $col = Start-Process -FilePath python -ArgumentList @('-X', 'warn_default_encoding', '-W', 'error::EncodingWarning', '-m', 'studio_pulse.cli', 'collect', '--config', 'pulse.yaml', '--port', '8787', '--country-header', 'CF-IPCountry') -PassThru -RedirectStandardOutput (Join-Path $out 'collect.out') -RedirectStandardError (Join-Path $out 'collect.err')
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            try { $up = (Invoke-RestMethod http://127.0.0.1:8787/healthz).ok } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { Get-Content (Join-Path $out 'collect.err'); "::error title=collector smoke (${{ matrix.os }})::pulse collect did not answer /healthz"; exit 1 }
          Run 'pulse simulate --verify' python -m studio_pulse.cli simulate --config pulse.yaml --backfill-days 3 --scale 0.3 --duration 60 --players 24 --pace 0.05 --ramp 10 --new-game-after 20 --verify --report (Join-Path $out 'sim.json')
          $sim = Get-Content -Raw (Join-Path $out 'sim.json') | ConvertFrom-Json
          $live = Invoke-RestMethod http://127.0.0.1:8787/live
          $new = @($live.apps | Where-Object { $_.app_id -eq 'demo.lanternleap' })
          if ($new.Count -ne 1 -or -not $sim.verify.ok -or -not $sim.accepted_matches) {
            "::error title=collector smoke (${{ matrix.os }})::/live or the counts do not match what the simulator sent: $($sim.verify | ConvertTo-Json -Depth 5 -Compress)"
            exit 1
          }
          Run 'pulse apps list' python -m studio_pulse.cli apps list --config pulse.yaml
          Run 'pulse run while the collector writes' python -X warn_default_encoding -W error::EncodingWarning -m studio_pulse.cli run --config pulse.yaml
          Run 'pulse serve --check' python -m studio_pulse.cli serve --config pulse.yaml --check
          Stop-Process -Id $col.Id
          $apps = ($live.apps | ForEach-Object { "$($_.app_id)=$($_.active)" }) -join ', '
          "::notice title=collector smoke (${{ matrix.os }})::sent $($sim.sent.events) events ($($sim.sent.resent_events) re-sent, $($sim.sent.invalid) invalid); collector accepted $($sim.collector_accepted); /live active: $apps; new app registered: demo.lanternleap"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: collector-smoke-${{ matrix.os }}
          path: smoke-out/
          if-no-files-found: ignore
          retention-days: 7

  cross-os-hash:
    name: cross-OS model hash
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fingerprint-*
          path: fingerprints
      - run: python3 .github/scripts/compare_fingerprints.py fingerprints

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: python3 .github/scripts/annotate.py "uv build" uv build --out-dir dist
      - name: The wheel carries models, defaults, UI assets and both entry points
        run: python3 .github/scripts/check_wheel.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  user-install:
    name: user install (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # Like a fresh machine: uv must download its own Python.
      UV_PYTHON_PREFERENCE: only-managed
      PY: ${{ matrix.os == 'windows-latest' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # The README's one-liners, character for character, with only the branch segment
      # of the raw URL pointed at this commit; the built wheel is the release stand-in.
      - name: README one-liner (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PULSE_SOURCE="$(ls "$PWD"/dist/*.whl)"
          line="$($PY .github/scripts/readme_oneliner.py sh "$GITHUB_SHA")"
          echo "README one-liner: $line"
          $PY .github/scripts/annotate.py "README one-liner, install.sh (${{ matrix.os }})" sh -c "$line"
      - name: README one-liner (Windows PowerShell 5.1, the irm | iex path)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PULSE_SOURCE = (Get-ChildItem dist\*.whl).FullName
          $line = & $env:PY .github\scripts\readme_oneliner.py ps $env:GITHUB_SHA
          Write-Host "README one-liner: $line"
          # cmd runs the line as typed at a prompt (it works the same in cmd and PowerShell)
          Set-Content -Path oneliner.cmd -Value $line -Encoding Ascii
          & $env:PY .github\scripts\annotate.py "README one-liner, install.ps1 (Windows PowerShell 5.1)" cmd /c oneliner.cmd
          exit $LASTEXITCODE
      # The installer added the launcher people double-click; run exactly what it points at
      # (the windowless studio-pulse program) in --check mode: a first launch builds the demo
      # behind the "preparing" page, serves the UI and stops (no window on a runner).
      - name: Desktop launcher (Start menu / Desktop, ~/Applications, app menu) and its first launch
        shell: pwsh
        run: |
          $annotate = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/annotate.py'
          function Fail([string]$msg) { "::error title=desktop launcher (${{ matrix.os }})::$msg"; exit 1 }
          $env:PULSE_HOME = Join-Path $env:RUNNER_TEMP ('app home ' + [char]0x00E7 + [char]0x0131)
          if ($IsWindows) {
            $shell = New-Object -ComObject WScript.Shell
            $target = $null
            foreach ($folder in 'Desktop', 'Programs') {
              $lnk = Join-Path ([Environment]::GetFolderPath($folder)) 'Studio Pulse.lnk'
              if (-not (Test-Path -LiteralPath $lnk)) { Fail "missing $lnk" }
              $target = $shell.CreateShortcut($lnk).TargetPath
              if (-not $target.EndsWith('studio-pulse.exe') -or -not (Test-Path -LiteralPath $target)) { Fail "$lnk points at '$target'" }
            }
            $p = Start-Process -FilePath $target -ArgumentList '--check' -Wait -PassThru
            $code = $p.ExitCode
          } elseif ($IsMacOS) {
            $app = Join-Path $HOME 'Applications/Studio Pulse.app'
            $target = Join-Path $app 'Contents/MacOS/studio-pulse'
            if (-not (Test-Path -LiteralPath $target)) { Fail "missing $target" }
            & plutil -lint (Join-Path $app 'Contents/Info.plist'); if ($LASTEXITCODE) { Fail 'Info.plist is not valid' }
            & $target --check; $code = $LASTEXITCODE
          } else {
            $entry = Join-Path $HOME '.local/share/applications/studio-pulse.desktop'
            if (-not (Test-Path -LiteralPath $entry)) { Fail "missing $entry" }
            $exec = (Select-String -LiteralPath $entry -Pattern '^Exec="(.+)"$').Matches[0].Groups[1].Value
            & $exec --check; $code = $LASTEXITCODE
          }
          $log = Join-Path $env:PULSE_HOME 'logs/app.log'
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 25 }
          if ($code -ne 0) { Fail "the launcher's first launch (--check) exited $code" }
          "::notice title=desktop launcher (${{ matrix.os }})::launcher present; first launch built the demo, served the UI with the heartbeat and stopped"
      - name: Doctor, demo, checks and UI in a folder with Turkish characters
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $HOME '.local/bin') + [IO.Path]::PathSeparator + $env:PATH
          $annotate = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/annotate.py'
          function Run([string]$title) {
            & $env:PY $annotate "$title (${{ matrix.os }})" @args
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          # built from code points so the workflow file's encoding cannot mangle it
          $name = 'T' + [char]0x00FC + 'rk' + [char]0x00E7 + 'e ' + [char]0x015E + [char]0x0131 + 'k demo'
          $work = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location -LiteralPath $work
          "PULSE_OUT=$work" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Run 'pulse doctor' pulse doctor
          Run 'pulse demo' pulse demo --scale 0.2
          $cfg = Join-Path $work '.pulse-demo/pulse.yaml'
          Run 'pulse check' pulse check --config $cfg
          Run 'pulse doctor --config' pulse doctor --config $cfg --json
          Run 'pulse serve --check' pulse serve --config $cfg --check
          Run 'pulse run (second refresh)' pulse run --config $cfg
          $hb = Get-Content -Raw -Encoding utf8 (Join-Path $work '.pulse-demo/pulse-state/heartbeat.json') | ConvertFrom-Json
          if ($hb.status -ne 'success') { "::error title=heartbeat (${{ matrix.os }})::status $($hb.status): $($hb.error)"; exit 1 }
          "::notice title=user install (${{ matrix.os }})::real installer; doctor, demo, $($hb.summary.checks) checks, UI check and a second refresh passed in $work"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dashboard-${{ matrix.os }}
          path: ${{ env.PULSE_OUT }}/demo-site
          if-no-files-found: warn
          retention-days: 7

  install-fallback:
    # No GitHub release is published: the installers must find the release wheel
    # missing (HTTP 404) and install the branch archive instead, saying so.
    name: install fallback 404 -> archive (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      UV_PYTHON_PREFERENCE: only-managed
      PY: ${{ matrix.os == 'windows-latest' && 'python' || 'python3' }}
      PULSE_RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/ci-no-such-release
      PULSE_ARCHIVE_URL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: README one-liner without PULSE_SOURCE (install.sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          line="$($PY .github/scripts/readme_oneliner.py sh "$GITHUB_SHA")"
          $PY .github/scripts/annotate.py "fallback install.sh" sh -c "$line" | tee install.log
          test "${PIPESTATUS[0]}" = 0
          grep -q "no release wheel for v.* (HTTP 404); source: branch archive" install.log \
            || { echo "::error title=install fallback::the installer did not report the archive fallback"; exit 1; }
      - name: README one-liner without PULSE_SOURCE (install.ps1, Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $line = & $env:PY .github\scripts\readme_oneliner.py ps $env:GITHUB_SHA
          Set-Content -Path oneliner.cmd -Value $line -Encoding Ascii
          & $env:PY .github\scripts\annotate.py "fallback install.ps1" cmd /c oneliner.cmd | Tee-Object -FilePath install.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Select-String -Path install.log -Pattern 'source: branch archive' -Quiet)) {
            "::error title=install fallback::the installer did not report the archive fallback"; exit 1
          }
      - name: The archive install works
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $HOME '.local/bin') + [IO.Path]::PathSeparator + $env:PATH
          $annotate = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/annotate.py'
          $work = Join-Path $env:RUNNER_TEMP 'fallback'
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location -LiteralPath $work
          & $env:PY $annotate "pulse demo from the archive install (${{ matrix.os }})" pulse demo --scale 0.05
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "::notice title=install fallback (${{ matrix.os }})::no release (HTTP 404): installed the branch archive and ran pulse demo"
          exit 0

  forecast-extra:
    name: forecast extra (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PULSE_REQUIRE_FORECAST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install with the statsforecast extra
        run: python .github/scripts/annotate.py "pip install [dev,forecast] (${{ matrix.os }})" python -m pip install -e ".[dev,forecast]"
      - name: forecast_band with statsforecast (and the alert engine)
        run: python .github/scripts/annotate.py "forecast tests (${{ matrix.os }})" python -X warn_default_encoding -W error::EncodingWarning -m pytest -p no:cacheprovider -rs tests/test_forecast.py tests/test_alerts.py

  flutter-package:
    name: flutter package (dart analyze, flutter test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter/studio_pulse_perf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      - run: python3 ../../.github/scripts/annotate.py "dart analyze" dart analyze
      - run: python3 ../../.github/scripts/annotate.py "flutter test" flutter test

  schedule-smoke:
    name: schedule smoke (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PULSE_SCHEDULE_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
      PY: ${{ matrix.os == 'windows-latest' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install with install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PULSE_SOURCE="$(ls "$PWD"/dist/*.whl)"
          $PY .github/scripts/annotate.py "install.sh (${{ matrix.os }})" sh install.sh
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PULSE_SOURCE = (Get-ChildItem dist\*.whl).FullName
          & $env:PY .github\scripts\annotate.py "install.ps1" powershell -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw .\install.ps1 | Invoke-Expression"
          exit $LASTEXITCODE
      - name: Register with the OS scheduler, fire it, wait for the heartbeat
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $HOME '.local/bin') + [IO.Path]::PathSeparator + $env:PATH
          $annotate = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/annotate.py'
          function Run([string]$title) {
            & $env:PY $annotate "$title (${{ matrix.os }})" @args
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $name = $env:PULSE_SCHEDULE_NAME
          $work = Join-Path $env:RUNNER_TEMP ('sched ' + [char]0x015E + [char]0x0131 + 'k')
          Run 'demo data' pulse demo --scale 0.05 --workdir (Join-Path $work '.pulse-demo') --out (Join-Path $work 'site')
          $cfg = Join-Path $work '.pulse-demo/pulse.yaml'
          Run 'pulse schedule install' pulse schedule install --name $name --config $cfg --at 03:00 --no-notify
          Run 'pulse schedule status' pulse schedule status --name $name --config $cfg
          Run 'pulse schedule run-now --wait' pulse schedule run-now --name $name --config $cfg --wait 240
          # the OS records the exit code a moment after the heartbeat is written
          for ($i = 0; $i -lt 30; $i++) {
            $st = pulse schedule status --name $name --config $cfg --json | ConvertFrom-Json
            $code = if ($IsWindows) { $st.scheduler.last_result } else { $st.scheduler.last_exit_code }
            if ("$code" -eq '0') { break }
            Start-Sleep -Seconds 2
          }
          $hb = $st.heartbeat
          $log = Join-Path $work '.pulse-demo/pulse-state/logs/pulse.log'
          if (-not $st.registered -or $hb.status -ne 'success' -or $hb.command -ne 'run' -or "$code" -ne '0' -or -not (Test-Path -LiteralPath $log)) {
            $json = ($st | ConvertTo-Json -Depth 6 -Compress) -replace '%', '%25'
            "::error title=schedule smoke (${{ matrix.os }})::OS exit code '$code', heartbeat '$($hb.status)', log present $(Test-Path -LiteralPath $log): $json"
            exit 1
          }
          "::notice title=schedule smoke (${{ matrix.os }})::$($st.scheduler.id) ($($st.scheduler.backend)) ran pulse run in $($hb.duration_s) s; OS exit code $code; heartbeat success at $($hb.last_success)"
          exit 0
      - name: Remove the schedule (always) and prove it is gone
        if: always()
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $HOME '.local/bin') + [IO.Path]::PathSeparator + $env:PATH
          $name = $env:PULSE_SCHEDULE_NAME
          & $env:PY (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/annotate.py') "pulse schedule remove (${{ matrix.os }})" pulse schedule remove --name $name --missing-ok
          $removeCode = $LASTEXITCODE
          $left = @()
          if ($IsMacOS) {
            $uid = (id -u)
            foreach ($d in "gui/$uid", "user/$uid") {
              launchctl print "$d/dev.studio-pulse.$name" *> $null
              if ($LASTEXITCODE -eq 0) { $left += "$d/dev.studio-pulse.$name" }
            }
            if (Test-Path "$HOME/Library/LaunchAgents/dev.studio-pulse.$name.plist") { $left += 'plist file' }
          }
          if ($IsWindows) {
            schtasks /query /tn "StudioPulse\$name" *> $null
            if ($LASTEXITCODE -eq 0) { $left += "\StudioPulse\$name" }
          }
          if ($left.Count -gt 0 -or $removeCode -ne 0) {
            "::error title=schedule removal (${{ matrix.os }})::still present: $($left -join ', ') (remove exit $removeCode)"
            exit 1
          }
          "::notice title=schedule removal (${{ matrix.os }})::$name removed; the OS scheduler no longer lists it"
          exit 0
