# Studio Pulse event contract v2: the ONE source for every name, type and limit.
#
# `python -m studio_pulse.contract.generate` writes, from this file:
#   src/studio_pulse/contract/generated.py                  Python constants + the spec the collector validates with
#   unity/com.studio.pulse/Runtime/PulseContract.g.cs       C# constants for the Unity SDK (pure C#, no UnityEngine)
#   flutter/studio_pulse_perf/lib/src/contract.g.dart       Dart constants for the Flutter SDK
#   contract/generated/pulse_v2.batch.schema.json           JSON Schema of a POST /v2/batch body
#   contract/generated/bigquery/*.json                      BigQuery table schemas (events, quarantine, registry, deletions)
#   docs/CONTRACT.md                                        the tables below as documentation
# CI regenerates and fails on any diff (`--check`). Edit this file, never the outputs.
#
# Names follow GA4's rules so the Firebase sink can forward the same events:
# 1-40 chars [a-z][a-z0-9_]*, <= 25 params, string values <= 100 chars, no
# Firebase-reserved names or prefixes. Automatic SDK events use the pulse_
# prefix because first_open, session_start, error, app_exception ... are reserved.

contract: pulse
version: "2.0"
batch_version: 2

limits:
  batch_max_events: 500          # more -> 413, the SDK halves the batch
  batch_max_bytes: 1048576       # 1 MiB uncompressed (and inflated, for gzip) -> 413
  event_max_bytes: 8192          # one event as compact JSON -> quarantined above
  name_max_len: 40
  max_params: 25
  string_max_len: 100            # default for string params (GA4); a param may set its own max_len
  future_tolerance_ms: 3600000   # after skew correction, ts more than 1 h ahead of received_at -> quarantined
  late_after_ms: 2592000000      # 30 days: older events are kept and flagged late
  min_ts_ms: 1577836800000       # 2020-01-01: anything older is a broken clock -> quarantined
  session_timeout_ms: 1800000    # 30 min in background starts a new session (Firebase default)
  session_max_ms: 86400000       # a session never spans more than 24 h
  errors_per_launch: 10          # unique pulse_error fingerprints per process
  flush_events: 20               # SDK flush triggers: 20 events, 30 s, background, quit
  flush_interval_ms: 30000
  heartbeat_ms: 60000
  queue_max_events: 10000        # on-device queue cap; oldest sessions dropped first
  queue_max_bytes: 5242880
  retry_min_ms: 2000             # retry backoff for network errors, 408, 429, 5xx (+1-5 s jitter)
  retry_max_ms: 60000
  raw_retention_days: 396        # 13 months of raw events, then deleted (aggregates are kept)
  deletion_max_days: 90          # deletion requests are executed within 90 days at most

names:
  pattern: "^[a-z][a-z0-9_]{0,39}$"
  sdk_prefix: pulse_             # only the SDK's automatic events may use it
  reserved_prefixes: [firebase_, google_, ga_, dynamic_link_, notification_]
  # Firebase drops these event names (FirebaseAnalytics.Event reference).
  reserved_names: [ad_activeview, ad_click, ad_exposure, ad_query, ad_reward, adunit_exposure,
                   app_background, app_clear_data, app_exception, app_remove, app_store_refund,
                   app_store_subscription_cancel, app_store_subscription_convert,
                   app_store_subscription_renew, app_update, app_upgrade, error, first_open,
                   first_visit, os_update, session_start, session_start_with_rollout,
                   user_engagement]

enums:
  platform: [android, ios, editor, windows, macos, linux, webgl]
  build_env: [release, debug, editor]
  install_store: [google_play, app_store, testflight, amazon, samsung, huawei, xiaomi, sideload,
                  simulator, editor, unknown]
  consent: [granted, denied, not_required, unknown]
  device_tier: [low, mid, high, unknown]
  exit_reason: [crash, crash_native, anr, low_memory, user, unclean, unknown]
  quit_reason: [menu, restart, background_timeout]
  setting: [music, sfx, haptics, notifications, language, quality]
  ad_action: [request, fill, show, click, reward, fail]
  pos_space: [norm, world]
  registry_status: [new, testing, live]

# Stores that make a release build count towards "live" (see docs/COLLECTOR.md).
production_stores: [google_play, app_store, amazon, samsung, huawei, xiaomi]

# Batch envelope: {"v": 2, "schema": "2.0", "sent_at": <ms>, "ctx": {...}, "events": [...]}
batch:
  v: {type: int, required: true, doc: "Envelope version, always 2"}
  schema: {type: string, required: true, max_len: 16, doc: "Contract version the SDK was built with"}
  sent_at: {type: int, required: true, doc: "Device clock when the request was sent, ms since epoch"}
  ctx: {type: object, required: true, doc: "Context shared by every event of the batch"}
  events: {type: array, required: true, doc: "1-500 events"}

ctx:
  app_id: {type: string, required: true, max_len: 150, pattern: "^[A-Za-z][A-Za-z0-9_.-]{0,149}$", doc: "Bundle id / package name"}
  platform: {type: string, required: true, enum: platform}
  app_version: {type: string, required: true, max_len: 50}
  install_id: {type: string, required: true, format: uuid, doc: "Random UUIDv4 per install; never a device or ad id"}
  build: {type: string, max_len: 50, doc: "Build number"}
  build_env: {type: string, enum: build_env, doc: "release, debug or editor"}
  install_store: {type: string, enum: install_store, doc: "Where the install came from (Android installer, iOS AppTransaction.environment)"}
  installer_raw: {type: string, max_len: 100, nullable: true, doc: "Installer package as reported, for anything the enum does not cover"}
  app_name: {type: string, max_len: 100, doc: "Display name; the registry uses it for new apps"}
  sdk: {type: string, required: true, max_len: 50, doc: "unity/2.0.0, flutter/2.0.0 ..."}
  engine: {type: string, max_len: 50}
  os: {type: string, max_len: 50}
  device_model: {type: string, max_len: 100}
  device_tier: {type: string, enum: device_tier}
  ram_mb: {type: int, min: 0}
  locale: {type: string, max_len: 35}
  tz_offset_min: {type: int, min: -900, max: 900}
  consent: {type: string, enum: consent, doc: "denied: the collector stores nothing from this batch"}
  child: {type: bool, doc: "Child-directed mode: uid and free-text params are stripped"}

event:
  id: {type: string, required: true, format: uuid, doc: "UUIDv7 made on the device; dedupe key"}
  seq: {type: int, required: true, min: 0, doc: "Per-install counter persisted on disk; gaps = loss, (install_id, seq) = dedupe key"}
  name: {type: string, required: true, doc: "Event name (rules above)"}
  ts: {type: int, required: true, doc: "Device clock, ms since epoch"}
  sid: {type: string, required: true, format: uuid, doc: "Session id"}
  snum: {type: int, min: 1, doc: "Session number of this install, from 1"}
  fg_ms: {type: int, min: 0, doc: "Foreground time in this session so far, ms"}
  uid: {type: string, max_len: 100, nullable: true, doc: "Optional game account id (never e-mail); null in child mode"}
  p: {type: object, doc: "Parameters (event catalog below)"}

# Event catalog. category: automatic (the SDK sends it) | game | app.
# Param fields: type (string|int|double|bool), required, enum, min, max, max_len,
# nullable, free_text (stripped in child mode), doc.
events:
  # -- automatic ------------------------------------------------------------------
  pulse_install:
    category: automatic
    doc: First launch of a new install_id (or an Android backup restore).
    params:
      install_store: {type: string, required: true, enum: install_store}
      installer_raw: {type: string, required: true, nullable: true, max_len: 100}
      restored: {type: bool, required: true, doc: "install_id came back from an Android backup"}
  pulse_session_start:
    category: automatic
    doc: Cold start, or foreground after more than session_timeout_ms in the background.
    params:
      cold: {type: bool, required: true}
      since_last_s: {type: int, min: 0, doc: "Seconds since the previous session ended"}
  pulse_foreground:
    category: automatic
    doc: App came to the foreground.
    params:
      fg_ms: {type: int, min: 0}
  pulse_background:
    category: automatic
    doc: App went to the background; triggers a flush.
    params:
      fg_ms: {type: int, min: 0}
  pulse_heartbeat:
    category: automatic
    doc: Every 60 s in the foreground, only if nothing else was sent in that minute.
    params:
      fg_ms: {type: int, min: 0}
  pulse_app_update:
    category: automatic
    doc: app_version differs from the last launch.
    params:
      from_version: {type: string, required: true, max_len: 50}
  pulse_error:
    category: automatic
    doc: Managed exception (Unity log hook, Flutter error hooks); at most errors_per_launch unique fingerprints per launch.
    params:
      type: {type: string, required: true, max_len: 100}
      msg: {type: string, max_len: 256, free_text: true, doc: "Scrubbed message (paths and numbers removed)"}
      frame: {type: string, max_len: 100, doc: "Top stack frame"}
      fp: {type: string, required: true, max_len: 20, doc: "64-bit fingerprint, hex"}
      fatal: {type: bool, required: true}
  pulse_exit:
    category: automatic
    doc: Sent at the next launch with the reason the previous process ended.
    params:
      reason: {type: string, required: true, enum: exit_reason}
      prev_sid: {type: string, max_len: 36}
      prev_version: {type: string, max_len: 50}
      rss_kb: {type: int, min: 0}
  pulse_consent:
    category: automatic
    doc: Consent state changed.
    params:
      state: {type: string, required: true, enum: consent}
  pulse_perf:
    category: automatic
    doc: One frame-time window (contract v1, unchanged; see docs/EVENTS.md).
    params:
      pulse_v: {type: int}
      tier: {type: string, enum: device_tier}
      scene: {type: string}
      window_s: {type: double, min: 0}
      frames: {type: int, min: 0}
      ft_src: {type: string, max_len: 20}
      ft_p50_ms: {type: double, min: 0}
      ft_p95_ms: {type: double, min: 0}
      ft_max_ms: {type: double, min: 0}
      slow_frames: {type: int, min: 0}
      janky_frames: {type: int, min: 0}
      cpu_main_p95_ms: {type: double, min: 0}
      gpu_p95_ms: {type: double, min: 0}
      mem_src: {type: string, max_len: 20}
      mem_alloc_mb: {type: int, min: 0}
      mem_reserved_mb: {type: int, min: 0}
      gc_reserved_mb: {type: int, min: 0}
      sys_used_mb: {type: int, min: 0}
      sys_mem_mb: {type: int, min: 0}
  pulse_load:
    category: automatic
    doc: A cold start or scene load (contract v1, unchanged).
    params:
      pulse_v: {type: int}
      tier: {type: string, enum: device_tier}
      kind: {type: string, required: true, max_len: 20}
      scene: {type: string}
      duration_ms: {type: double, required: true, min: 0}

  # -- game -----------------------------------------------------------------------
  level_start:
    category: game
    doc: A level attempt begins.
    params:
      level: {type: int, required: true, min: 0}
      level_name: {type: string, free_text: true}
      world: {type: string}
      attempt: {type: int, min: 1}
      mode: {type: string}
  level_complete:
    category: game
    doc: The level was won.
    params:
      level: {type: int, required: true, min: 0}
      attempt: {type: int, required: true, min: 1}
      duration_ms: {type: int, required: true, min: 0}
      score: {type: int}
      stars: {type: int, min: 0, max: 5}
      moves_left: {type: int}
  level_fail:
    category: game
    doc: The level was lost; pos_x/pos_y feed the death heatmap.
    params:
      level: {type: int, required: true, min: 0}
      attempt: {type: int, required: true, min: 1}
      duration_ms: {type: int, required: true, min: 0}
      reason: {type: string, required: true, max_len: 40, doc: "Short static code: out_of_moves, out_of_time, hit_spike ..."}
      progress: {type: double, min: 0, max: 1, doc: "Share of the level done, 0-1"}
      pos_x: {type: double}
      pos_y: {type: double}
      pos_space: {type: string, enum: pos_space, doc: "norm (0-1 of the level bounds, default) or world units"}
      score: {type: int}
  level_quit:
    category: game
    doc: The player left a level without winning or losing.
    params:
      level: {type: int, required: true, min: 0}
      attempt: {type: int, required: true, min: 1}
      duration_ms: {type: int, required: true, min: 0}
      reason: {type: string, required: true, enum: quit_reason}
      progress: {type: double, min: 0, max: 1}
      pos_x: {type: double}
      pos_y: {type: double}
      pos_space: {type: string, enum: pos_space}
  tutorial_begin:
    category: game
    doc: Tutorial started (GA4 recommended name).
    params:
      tutorial: {type: string, doc: "Which tutorial, when there are several"}
  tutorial_step:
    category: game
    doc: A tutorial step was shown.
    params:
      step: {type: int, required: true, min: 0}
      step_name: {type: string, free_text: true}
      tutorial: {type: string}
  tutorial_complete:
    category: game
    doc: Tutorial finished (GA4 recommended name).
    params:
      tutorial: {type: string}
  setting_change:
    category: game
    doc: A setting changed; one event with setting=..., not music_off.
    params:
      setting: {type: string, required: true, enum: setting}
      from: {type: string, max_len: 20, doc: "Previous value: on/off, a language code, a quality level"}
      to: {type: string, required: true, max_len: 20}
  earn_virtual_currency:
    category: game
    doc: Soft currency earned (GA4 recommended name).
    params:
      virtual_currency_name: {type: string, required: true, max_len: 40}
      value: {type: double, required: true}
      item_name: {type: string}
      level: {type: int, min: 0}
  spend_virtual_currency:
    category: game
    doc: Soft currency spent (GA4 recommended name).
    params:
      virtual_currency_name: {type: string, required: true, max_len: 40}
      value: {type: double, required: true}
      item_name: {type: string}
      level: {type: int, min: 0}
  purchase:
    category: game
    doc: Real-money purchase. Not forwarded to Firebase (GA4 logs in_app_purchase itself).
    firebase: false
    params:
      transaction_id: {type: string, required: true}
      product_id: {type: string, required: true}
      price_micros: {type: int, required: true, min: 0, doc: "Price paid in micros of currency"}
      currency: {type: string, required: true, max_len: 3, doc: "ISO 4217"}
      is_restore: {type: bool}
      is_sandbox: {type: bool}
  ad_impression:
    category: game
    doc: Impression-level ad revenue (Firebase ad revenue parameters).
    params:
      ad_platform: {type: string, required: true, max_len: 40}
      ad_format: {type: string, required: true, max_len: 40}
      value: {type: double, required: true, min: 0, doc: "Revenue in currency, dot decimal"}
      currency: {type: string, required: true, max_len: 3}
      ad_source: {type: string}
      ad_unit_name: {type: string}
      placement: {type: string}
      precision: {type: string, max_len: 20}
  ad_event:
    category: game
    doc: Ad lifecycle step.
    params:
      action: {type: string, required: true, enum: ad_action}
      ad_format: {type: string, required: true, max_len: 40}
      placement: {type: string}
      error_code: {type: string, max_len: 40}

  # -- app ------------------------------------------------------------------------
  screen_view:
    category: app
    doc: A screen was shown (GA4 parameter names).
    params:
      screen_name: {type: string, required: true}
      screen_class: {type: string}

# Custom events: any other valid name outside the pulse_ prefix, generic rules only
# (<= 25 params, typed scalar values). Keep the set small and static.

# What the SDK collects, mapped to Apple's privacy manifest / App Store labels and
# Google Play's Data safety form (docs/PRIVACY.md; legal review needed before
# a store submission). Linked: Apple treats pseudonymous analytics data as linked.
privacy:
  - data: Product interaction
    apple: NSPrivacyCollectedDataTypeProductInteraction
    play: "App activity: App interactions"
    from: "sessions, level_*, tutorial_*, setting_change, screen_view, earn/spend_virtual_currency, ad_event, custom events"
  - data: Crash data
    apple: NSPrivacyCollectedDataTypeCrashData
    play: "App info and performance: Crash logs"
    from: "pulse_error, pulse_exit"
  - data: Performance data
    apple: NSPrivacyCollectedDataTypePerformanceData
    play: "App info and performance: Diagnostics"
    from: "pulse_perf, pulse_load"
  - data: Other diagnostic data
    apple: NSPrivacyCollectedDataTypeOtherDiagnosticData
    play: "App info and performance: Diagnostics"
    from: "ctx: os, device_model, device_tier, ram_mb, sdk, engine"
  - data: Device ID
    apple: NSPrivacyCollectedDataTypeDeviceID
    play: "Device or other IDs"
    from: "ctx.install_id (random UUID per install; no IDFA, AAID, IDFV or Android ID)"
  - data: User ID
    apple: NSPrivacyCollectedDataTypeUserID
    play: "Personal info: User IDs"
    from: "event uid, only when the game sets an account id (never in child mode)"
  - data: Purchase history
    apple: NSPrivacyCollectedDataTypePurchaseHistory
    play: "Financial info: Purchase history"
    from: "purchase"
  - data: Coarse location
    apple: NSPrivacyCollectedDataTypeCoarseLocation
    play: "Location: Approximate location"
    from: "country derived from the request IP by the collector; the IP is never stored"

# What the collector stores per event (NDJSON in local mode, BigQuery in cloud
# mode). TIMESTAMP columns are ms integers in NDJSON.
storage:
  events:
    doc: One row per accepted event. Partition by DATE(received_at), cluster by app_id, name.
    columns:
      - {name: event_id, type: STRING, mode: REQUIRED}
      - {name: seq, type: INT64}
      - {name: name, type: STRING, mode: REQUIRED}
      - {name: ts, type: TIMESTAMP, mode: REQUIRED, doc: "Server-corrected time: received_at - (sent_at - ts_client)"}
      - {name: ts_client, type: TIMESTAMP, doc: "Device clock as sent"}
      - {name: sent_at, type: TIMESTAMP}
      - {name: received_at, type: TIMESTAMP, mode: REQUIRED}
      - {name: skew_ms, type: INT64, doc: "received_at - sent_at (device clock error plus transit)"}
      - {name: late, type: BOOL, doc: "ts older than late_after_ms when received"}
      - {name: sid, type: STRING}
      - {name: snum, type: INT64}
      - {name: fg_ms, type: INT64}
      - {name: uid, type: STRING}
      - {name: params, type: STRING, doc: "Event parameters as a JSON object (text, so every sink can write it)"}
      - {name: app_id, type: STRING, mode: REQUIRED}
      - {name: platform, type: STRING, mode: REQUIRED}
      - {name: app_version, type: STRING}
      - {name: build, type: STRING}
      - {name: build_env, type: STRING}
      - {name: install_id, type: STRING, mode: REQUIRED}
      - {name: install_store, type: STRING}
      - {name: installer_raw, type: STRING}
      - {name: sdk, type: STRING}
      - {name: engine, type: STRING}
      - {name: os, type: STRING}
      - {name: device_model, type: STRING}
      - {name: device_tier, type: STRING}
      - {name: ram_mb, type: INT64}
      - {name: locale, type: STRING}
      - {name: tz_offset_min, type: INT64}
      - {name: consent, type: STRING}
      - {name: child, type: BOOL}
      - {name: country, type: STRING, doc: "ISO 3166-1 alpha-2 from the request IP (IP discarded) or unknown"}
      - {name: key_id, type: STRING, doc: "Which write key (hash prefix), for rotation"}
      - {name: schema, type: STRING, doc: "Contract version the SDK sent (1 for upgraded v1 lines)"}
  quarantine:
    doc: Events and batches that failed validation, with the reason; counted by the data-quality checks.
    columns:
      - {name: received_at, type: TIMESTAMP, mode: REQUIRED}
      - {name: reason, type: STRING, mode: REQUIRED}
      - {name: app_id, type: STRING}
      - {name: platform, type: STRING}
      - {name: install_id, type: STRING}
      - {name: event_id, type: STRING}
      - {name: name, type: STRING}
      - {name: raw, type: STRING, doc: "The event (or batch head) as received, truncated to 8 KB"}
      - {name: key_id, type: STRING}
  app_registry:
    doc: One row per (app_id, platform), created by the first event; status new -> testing -> live.
    columns:
      - {name: app_id, type: STRING, mode: REQUIRED}
      - {name: platform, type: STRING, mode: REQUIRED}
      - {name: display_name, type: STRING}
      - {name: genre, type: STRING}
      - {name: status, type: STRING, mode: REQUIRED}
      - {name: first_seen, type: TIMESTAMP, mode: REQUIRED}
      - {name: last_seen, type: TIMESTAMP}
      - {name: first_version, type: STRING}
      - {name: last_version, type: STRING}
      - {name: status_changed_at, type: TIMESTAMP}
      - {name: store_listed, type: BOOL}
      - {name: store_version, type: STRING}
      - {name: store_url, type: STRING}
      - {name: store_checked_at, type: TIMESTAMP}
  deletion_requests:
    doc: Deletion requests by install_id (POST /v2/delete); executed by the next run, within deletion_max_days.
    columns:
      - {name: install_id, type: STRING, mode: REQUIRED}
      - {name: app_id, type: STRING}
      - {name: requested_at, type: TIMESTAMP, mode: REQUIRED}
      - {name: reason, type: STRING}
      - {name: status, type: STRING}
      - {name: done_at, type: TIMESTAMP}
