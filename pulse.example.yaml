# Copy to pulse.local.yaml (gitignored) and fill in. No secrets go in this file:
#  - BigQuery / Cloud Storage use Application Default Credentials
#    (`gcloud auth application-default login` or GOOGLE_APPLICATION_CREDENTIALS);
#  - AdMob uses ADC with the admob.readonly scope, or $PULSE_ADMOB_ACCESS_TOKEN;
#  - Slack / SMTP settings come from environment variables (see README).
# Any value can reference an environment variable: ${NAME} or ${NAME:-default}.
# The desktop icon and scheduled runs start without your shell's variables: put
# them (PULSE_LLM_PROJECT, PULSE_READ_KEY, ...) as NAME=VALUE lines in a private
# file (chmod 600) and name it here; the shell's own values still win.
# env_file: [private.env]

title: Studio Pulse
warehouse: local/pulse.duckdb      # DuckDB file (gitignored)
site_dir: local/site               # dashboard output
lookback_days: 60                  # every run refreshes this window
max_bytes_billed: 2000000000       # hard cap per BigQuery query (2 GB)
alerts: alerts.yaml
ua:
  min_creative_impressions: 5000   # below: "insufficient data", never ranked
  # creative_parser: "regex:(?P<creative_id>cr\d+)"   # default: creative-forge ad names
fx_rates:                          # fallback only, USD per unit (also UA spend)
  EUR: 1.08
  TRY: 0.029

apps:
  - id: puzzle_game                # [a-z0-9_]+, used in URLs and tables
    name: Puzzle Game
    genre: puzzle
    platforms: [ANDROID, IOS]
    timezone: Europe/Istanbul      # the GA4 property's reporting time zone (default UTC)
    sources:
      ga4_bigquery:
        project: ${PULSE_GCP_PROJECT}
        dataset: analytics_000000000
        app_info_ids: [com.example.puzzle]   # keep only this app's streams
        iap_events: [in_app_purchase]
        ad_events: [ad_impression]
        churn_window_days: 7
      crashlytics_bigquery:
        project: ${PULSE_GCP_PROJECT}
        dataset: firebase_crashlytics
        tables: [com_example_puzzle_ANDROID, com_example_puzzle_IOS]
      revenuecat:
        path: gs://example-revenuecat-exports/transactions   # or a local folder
      admob:
        publisher_id: pub-0000000000000000
        app_ids: [ca-app-pub-0000000000000000~0000000000]
      play_console:
        path: local/reports/play            # or gs://pubsite_prod_rev_<id>/stats/ (read directly)
        package: com.example.puzzle
      app_store:
        path: local/reports/appstore        # daily Summary Sales reports
        # vendor_number: "00000000"         # or download them: App Store Connect API (PULSE_ASC_*)
        apple_id: "0000000000"
        sku: com.example.puzzle
      unity_jsonl:
        path: local/telemetry/puzzle        # files written by JsonLinesSink
        app: com.example.puzzle
      # Ad-network spend. Tokens come from environment variables only.
      meta_ads:
        account_id: "0000000000"            # PULSE_META_ACCESS_TOKEN
      google_ads:
        customer_id: "000-000-0000"         # ADC (adwords scope) or PULSE_GOOGLE_ADS_ACCESS_TOKEN
        quota_project: ${PULSE_GCP_PROJECT}
        platform: ANDROID
        attribution: ga4                    # GA4 first-touch campaign (default for Google Ads)
      tiktok_ads:
        advertiser_id: "0000000000000000000"  # PULSE_TIKTOK_ACCESS_TOKEN
      ua_csv:
        network: applovin
        path: local/reports/applovin        # report exports you download
      play_reviews:
        path: gs://pubsite_prod_rev_00000000000000000000/reviews/
        package: com.example.puzzle
        api: true                           # also the Play API's last 7 days
      app_store_reviews:
        apple_id: "0000000000"              # PULSE_ASC_KEY_ID / _ISSUER_ID / _PRIVATE_KEY_PATH
      android_vitals:
        package: com.example.puzzle
    experiments:
      - id: booster_offer_v2
        start: 2026-11-01
        end: 2026-11-21
        metric_event: booster_used          # count per user in the 7 days after exposure
        conversion_event: in_app_purchase
        control: A
        split: {A: 0.5, B: 0.5}

  - id: fitness_app
    name: Fitness App
    genre: fitness
    platforms: [ANDROID, IOS]
    sources:
      ga4_bigquery:
        project: ${PULSE_GCP_PROJECT}
        dataset: analytics_000000001
        # A custom event that carries an FPS value can feed the perf model:
        fps_events:
          - {event: camera_session_completed, fps_param: median_fps, scene: camera}
      revenuecat:
        path: local/revenuecat/fitness

# Market radar (docs/RADAR.md): daily store charts -> breakouts, mechanic trends, a digest in
# Turkish and English and market_trends.yaml for creative-forge. Kept local (out_dir).
