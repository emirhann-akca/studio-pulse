#   publishers: [{id: "1743349083", name: ABI Global}]
#   play: {country: us, daily_budget: 200}
#   llm: {max_apps: 25, narrate: false}
#   estimates: {panel_size: 80, min_games: 10}   # rank -> downloads / revenue bands
#   out_dir: local/radar
