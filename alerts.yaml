# Alert rules evaluated by `pulse alerts` (and shown on the dashboard).
# Metrics are listed in src/studio_pulse/alerts.py (METRICS); formulas are in
# docs/METRICS.md. Conditions: above | below | drop_vs_baseline | rise_vs_baseline |
# forecast_band (weekly seasonality, see src/studio_pulse/stats/forecast.py).

defaults:
  severity: warning

rules:
  - name: d1_retention_drop
    description: Newest complete install cohort keeps >20% fewer users on day 1 than the trailing 14 cohorts.
    metric: d1_retention
    condition: drop_vs_baseline
    baseline_days: 14
    threshold_pct: 20
    min_sample: 50          # ignore cohorts smaller than 50 users
    min_z: 3                # and drops that a cohort this size produces by chance

  - name: crash_free_users_low
    description: Fewer than 99% of daily active users were crash-free.
    metric: crash_free_users
    condition: below
    threshold: 0.99
    min_sample: 100         # needs at least 100 DAU
    severity: critical

  - name: low_tier_frame_time_high
    description: Median frame time on low-tier devices above 20 ms (below ~50 fps).
    metric: frame_time_p50_ms
    where: {device_tier: low}
    condition: above
    threshold: 20
    min_sample: 20          # perf windows that day

  - name: slow_frames_high
    description: More than 5% of all frames took longer than 33.3 ms.
    metric: slow_frame_share
    where: {device_tier: all}
    condition: above
    threshold: 0.05
    min_sample: 20

  - name: dau_drop
    description: DAU 25% below its trailing 14-day mean.
    metric: dau
    condition: drop_vs_baseline
    baseline_days: 14
    threshold_pct: 25
    min_sample: 50

  - name: arpdau_drop
    description: ARPDAU (3-day average) 30% below its trailing 14-day mean.
    metric: arpdau
    condition: drop_vs_baseline
    evaluate_days: 3
    baseline_days: 14
    threshold_pct: 30
    min_sample: 100

  - name: cold_start_slow
    description: Median cold start above 5 seconds.
    metric: cold_start_p50_ms
    condition: above
    threshold: 5000
    min_sample: 20

  - name: new_users_forecast
    description: New users below the expected band for that weekday (trend + weekly seasonality); holidays never alert.
    metric: new_users
    condition: forecast_band
    direction: drop
    history_days: 56
    min_sample: 50
    holidays: [2026-12-25, 2027-01-01]

  - name: ua_cpi_rise
    description: Blended network CPI (3-day average) 40% above its trailing 14-day mean.
    metric: ua_cpi_usd
    condition: rise_vs_baseline
    evaluate_days: 3
    baseline_days: 14
    threshold_pct: 40
    min_sample: 30          # network-reported installs that day

  - name: low_star_reviews_high
    description: More than 40% of the week's new reviews have 1 or 2 stars.
    metric: low_star_share
    condition: above
    threshold: 0.4
    evaluate_days: 7
    min_sample: 1

  - name: play_crash_rate_bad
    description: Android vitals user-perceived crash rate above Play's bad-behaviour threshold (1.09%).
    metric: vitals_crash_rate
    condition: above
    threshold: 0.0109
    min_sample: 100         # distinct users that day
