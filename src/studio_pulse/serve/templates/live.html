{% extends "base.html" %}
{% block title %}{{ s.l_title }}{% endblock %}
{% block head %}
<style>
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.live-card .big{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.live-card .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 4px}
.live-card .spark{display:block;max-width:100%;color:var(--accent)}
.pulse-dot{animation:pulse 2s infinite}@keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.pulse-dot{animation:none}}
</style>
{% endblock %}
{% block body %}
<header class="page-head"><h1><span class="dot live pulse-dot" aria-hidden="true"></span> {{ s.l_title }}</h1><p class="sub">{{ s.l_sub }}</p></header>
{% include "_live.html" %}
{% endblock %}
