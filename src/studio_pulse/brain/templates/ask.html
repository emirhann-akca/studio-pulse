{% extends "base.html" %}
{% block title %}{{ t.ask }}{% endblock %}
{% block head %}{% include "_brain_style.html" %}{% endblock %}
{% block body %}
<header class="page-head"><h1>{{ t.ask }}</h1><p class="sub">{{ t.how }}</p></header>
<form class="ask-form" method="get" action="/ask" hx-post="/ask" hx-target="#answer" hx-swap="innerHTML">
  <input type="hidden" name="lang" value="{{ lang }}">
  <input class="input" type="text" name="q" value="{{ q }}" maxlength="500" required placeholder="{{ t.placeholder }}" aria-label="{{ t.ask }}">
  <button class="btn primary" type="submit">{{ t.ask_btn }}</button>
</form>
<div class="examples" aria-label="{{ t.examples }}">{% for e in examples %}<button class="btn sm" type="button" hx-post="/ask" hx-target="#answer" hx-vals='{{ {"q": e, "lang": lang}|tojson }}'>{{ e }}</button>{% endfor %}</div>
<div id="answer" aria-live="polite">{% if answer %}{% include "_answer.html" %}{% endif %}</div>
{% endblock %}
