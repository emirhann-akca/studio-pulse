  # -- level funnel ----------------------------------------------------------
  level_win_rate:
    name: {en: level win rate, tr: seviye kazanma oranı}
    synonyms: {en: [win rate, completion rate, pass rate], tr: [kazanma oranı, geçme oranı, tamamlama oranı]}
    unit: pct
    better: up
    model: fct_level_funnel
    value: win_rate
    dims: [level]
    aggregation: pooled
    numerator: completes
    denominator: completes + fails
    sample: completes + fails
    definition: completes / (completes + fails)
  level_fail_rate:
    name: {en: level fail rate, tr: seviye başarısızlık oranı}
    synonyms: {en: [fail rate, failure rate, difficulty, hardest level, hard levels], tr: [başarısızlık oranı, kaybetme oranı, zorluk, en zor seviye, zor seviyeler]}
    unit: pct
    better: down
    model: fct_level_funnel
    value: CAST(fails AS DOUBLE) / NULLIF(completes + fails, 0)
    dims: [level]
    aggregation: pooled
    numerator: fails
    denominator: completes + fails
    sample: completes + fails
    definition: fails / (completes + fails)
  attempts_per_completion:
    name: {en: attempts per completion, tr: tamamlama başına deneme}
    synonyms: {en: [attempts, tries per win], tr: [deneme sayısı]}
    unit: ratio
    better: down
    model: fct_level_funnel
    value: attempts_per_completion
    dims: [level]
    aggregation: pooled
    numerator: starts
    denominator: completes
    sample: starts
    definition: starts / completes
  users_reached:
    name: {en: users reaching the level, tr: seviyeye ulaşan kullanıcı}
    synonyms: {en: [reached, players reaching], tr: [ulaşan oyuncu]}
    unit: count
    better: up
    model: fct_level_funnel
    value: users_reached
    dims: [level]
    aggregation: latest
    definition: users whose highest started level in the window is >= level
  level_churn_rate:
    name: {en: churn at level, tr: seviyede bırakma oranı}
    synonyms: {en: [level churn, quit rate, drop-off], tr: [bırakma, seviyede bırakma, terk oranı, kopma]}
    unit: pct
    better: down
    model: fct_level_funnel
    value: churn_rate
    dims: [level]
    aggregation: pooled
    numerator: users_churned
    denominator: users_reached
    sample: users_reached
    definition: users who stopped at this level and were inactive for the churn window / users reached
  level_churned_users:
    name: {en: players who quit at the level, tr: seviyede bırakan oyuncu}
    synonyms: {en: [most players quit, players quit, give up, where players quit], tr: [en çok bırakıyor, oyunu bırakan, bırakan oyuncu]}
    unit: count
    better: down
    model: fct_level_funnel
    value: users_churned
    dims: [level]
    aggregation: latest
    sample: users_reached
    definition: users whose highest started level is this one and who were inactive for the churn window

  # -- user acquisition ------------------------------------------------------
  ua_spend_usd:
    name: {en: UA spend, tr: kullanıcı edinme harcaması}
    synonyms: {en: [spend, ad spend, marketing spend, cost, spent, spending, money spent, spent the most], tr: [harcama, reklam harcaması, pazarlama harcaması, maliyet, harcadı, harcanan, en çok harcayan]}
    unit: usd
    better: none
    model: fct_ua_daily
    time: date
    value: spend_usd
    dims: [network, campaign_name]
    aggregation: sum
    sample: network_installs
    alert: {baseline: mean_of_daily}
    definition: ad-network spend in USD
    sources:
      - model: stg_ua_spend
        dims: [network, campaign_name, country, platform]
    default_days: 30
  ua_installs:
    name: {en: network installs, tr: ağ kurulumu}
    synonyms: {en: [paid installs, installs from ads, ua installs, network-reported installs], tr: [reklamdan gelen kurulum, ücretli kurulum, ağ kurulumları]}
    unit: count
    better: up
    model: fct_ua_daily
    time: date
    value: network_installs
    dims: [network, campaign_name]
    aggregation: sum
    definition: installs reported by the ad network
    sources:
      - model: stg_ua_spend
        dims: [network, campaign_name, country, platform]
    default_days: 30
  ua_cpi_usd:
    name: {en: CPI, tr: CPI}
    synonyms: {en: [cost per install, install cost, pay per install, cheapest installs], tr: [kurulum başına maliyet, edinme maliyeti, kurulum başı maliyet, kurulum maliyeti]}
    unit: usd
    better: down
    model: fct_ua_daily
    time: date
    value: cpi_usd
    dims: [network, campaign_name]
    aggregation: pooled
    numerator: spend_usd
    denominator: network_installs
    sample: network_installs
    alert: {baseline: pooled}
    definition: spend / network-reported installs
    sources:
      - model: stg_ua_spend
        dims: [network, campaign_name, country, platform]
        value: "spend_usd / NULLIF(network_installs, 0)"
    default_days: 30
  ua_ctr:
    name: {en: CTR, tr: tıklama oranı}
    synonyms: {en: [click-through rate, ctr], tr: [ctr, tıklanma oranı]}
    unit: pct
    better: up
    model: fct_ua_daily
    time: date
    value: ctr
    dims: [network, campaign_name]
    aggregation: pooled
    numerator: clicks
    denominator: impressions
    sample: impressions
    definition: clicks / impressions
    sources:
      - model: stg_ua_spend
        dims: [network, campaign_name, country, platform]
        value: "clicks / NULLIF(impressions, 0)"
    default_days: 30
  ua_ipm:
    name: {en: IPM, tr: IPM}
    synonyms: {en: [installs per mille, installs per thousand impressions], tr: [bin gösterim başına kurulum]}
    unit: ratio
    better: up
    model: fct_ua_daily
    time: date
    value: ipm
    dims: [network, campaign_name]
    aggregation: pooled
    numerator: network_installs * 1000
    denominator: impressions
    sample: impressions
    definition: network installs / impressions x 1000
    sources:
      - model: stg_ua_spend
        dims: [network, campaign_name, country, platform]
        value: "network_installs * 1000.0 / NULLIF(impressions, 0)"
    default_days: 30
  ua_spend_share:
    name: {en: campaign spend share, tr: kampanya harcama payı}
    synonyms: {en: [share of spend], tr: [harcama payı]}
    unit: pct
    better: none
    model: fct_ua_daily
    time: date
    value: spend_share
    dims: [network, campaign_name]
    aggregation: latest
    definition: the campaign's spend / the app's spend that day
  roas_d7:
    name: {en: D7 ROAS, tr: D7 ROAS}
    synonyms: {en: [return on ad spend day 7, roas], tr: [reklam harcaması getirisi, roas]}
