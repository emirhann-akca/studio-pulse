  low_star_share:
    name: {en: low-star review share, tr: düşük yıldızlı yorum payı}
    synonyms: {en: [bad reviews, 1 and 2 star share, negative reviews, low-star share, 1-2 star reviews, one and two star], tr: [kötü yorumlar, olumsuz yorumlar, düşük puanlı yorumlar, 1-2 yıldızlı yorum, düşük yıldızlı yorum, 1 ve 2 yıldız]}
    unit: pct
    better: down
    model: fct_review_daily
    time: date
    value: low_star_share
    filter: store = 'all'
    aggregation: pooled
    numerator: low_star_share * reviews
    denominator: reviews
    sample: reviews
    alert: {baseline: pooled}
    definition: share of that day's reviews with 1 or 2 stars
  version_rating:
    name: {en: rating by version, tr: sürüme göre puan}
    synonyms: {en: [version rating], tr: [sürüm puanı]}
    unit: ratio
    better: up
    model: fct_rating_by_version
    value: avg_rating
    dims: [app_version, store]
    aggregation: latest
    sample: reviews
    definition: mean stars per app version (Play reviews carry the version)
  creative_ipm:
    name: {en: creative IPM, tr: kreatif IPM}
    synonyms: {en: [best creative, creative performance], tr: [en iyi kreatif, kreatif performansı]}
    unit: ratio
    better: up
    model: fct_creative_scorecard
    value: ipm
    filter: status = 'ranked'
    dims: [network, creative_key]
    aggregation: latest
    sample: impressions
    definition: installs / impressions x 1000 per creative over all its days (ranked creatives only)
  store_rating:
    name: {en: store rating, tr: mağaza puanı}
    synonyms: {en: [overall rating, cumulative rating, total rating, play rating, overall google play rating], tr: [genel puan, toplam puan, mağaza genel puanı]}
    unit: ratio
    better: up
    model: stg_store_daily
    time: date
    value: total_avg_rating
    filter: total_avg_rating IS NOT NULL
    dims: [store]
    aggregation: latest
    definition: the store's cumulative average rating (Play's Total Average Rating), latest day
  review_topic_share:
    name: {en: share of reviews by topic, tr: konuya göre yorum payı}
    synonyms: {en: [complain, complaints, complaint, reviewers complain, review topics], tr: [şikayet, şikâyet, şikayet ediliyor, yorum konuları]}
    unit: pct
    better: none
    model: fct_review_topics
    value: share_30d
    filter: share_30d IS NOT NULL
    dims: [topic]
    aggregation: latest
    sample: reviews_30d
    definition: share of the last 30 days' reviews matching the topic's keywords
  pltv_usd:
    name: {en: predicted LTV, tr: tahmini LTV}
    synonyms: {en: [pltv, predicted ltv, predicted lifetime value, ltv prediction], tr: [tahmini ltv, öngörülen ltv, ltv tahmini, tahmini yaşam boyu değer]}
    unit: usd
    better: up
    model: fct_pltv_summary
    value: predicted_arpu_usd
    dims: [horizon_day]
    aggregation: latest
    definition: pLTV v1 predicted cumulative ARPU of the latest 28 cohorts at the horizon day (a model output, not data)
  experiment_lift:
    name: {en: experiment lift, tr: deney artışı}
    synonyms: {en: [lift, relative lift, uplift], tr: [artış, göreli artış]}
    unit: pct
    better: up
    model: fct_experiment_tests
    value: rel_estimate
    filter: rel_estimate IS NOT NULL
    dims: [experiment_id, test]
    aggregation: latest
    definition: relative difference of the variant against control ((m_t - m_c) / m_c)
  experiment_srm_p:
    name: {en: sample ratio mismatch p-value, tr: örneklem oranı uyumsuzluğu p değeri}
    synonyms: {en: [srm, sample ratio mismatch, srm p], tr: [srm, örneklem oranı uyumsuzluğu]}
    unit: ratio
    better: none
    model: fct_experiment_arms
    value: srm_p
    filter: is_control
    dims: [experiment_id]
    aggregation: latest
    definition: chi-square goodness-of-fit p-value of users per variant against the configured split
  data_through:
    name: {en: data through, tr: veri bitiş günü}
    synonyms: {en: [last loaded day, loaded up to, freshness], tr: [en son yüklenen gün, yüklendiği gün, güncellik]}
    unit: date
    better: none
    model: fct_source_freshness
    value: data_through
    dims: [source]
    aggregation: latest
    definition: the newest data day of each source
  # -- studio SDK (collector) ------------------------------------------------
  setting_off_share:
    name: {en: share who turn a setting off, tr: ayarı kapatanların payı}
    synonyms: {en: [turn off, turn the music off, turned off, mute, music off, sound off, switch off], tr: [kapatıyor, kapatma oranı, kapatan, kapatanlar, müziği kapatıyor, sesi kapatıyor]}
    unit: pct
    better: none
    model: fct_sdk_settings
    value: off_share
    dims: [setting]
    aggregation: latest
    sample: players
    definition: installs that set the setting to off / installs with any event
  sdk_errors_per_session:
    name: {en: errors per session, tr: oturum başına hata}
    synonyms: {en: [error rate per session, errors per session], tr: [oturum başına hata]}
    unit: ratio
    better: down
    model: fct_sdk_errors_daily
    time: date
    value: errors_per_session
    aggregation: pooled
    numerator: errors
    denominator: sessions
    sample: sessions
    definition: pulse_error events / sessions (SDK apps)
  sdk_crash_free_sessions:
    name: {en: SDK crash-free sessions, tr: SDK çökmesiz oturum oranı}
    unit: pct
    better: up
    model: fct_sdk_errors_daily
    time: date
    value: crash_free_sessions
    aggregation: pooled
    numerator: sessions - crashed_sessions
    denominator: sessions
    sample: sessions
    definition: 1 - crashed sessions / sessions (SDK apps; crash = pulse_exit crash/anr or a fatal pulse_error)
  sdk_level_fail_rate:
    name: {en: SDK level fail rate, tr: SDK seviye başarısızlık oranı}
    unit: pct
    better: down
    model: fct_sdk_level_funnel
    value: fail_rate
    dims: [level]
    aggregation: pooled
    numerator: fails
    denominator: completes + fails
    sample: completes + fails
    definition: fails / (completes + fails), production SDK builds
  sdk_avg_attempts_to_win:
    name: {en: average attempts to win, tr: kazanmak için ortalama deneme}
    synonyms: {en: [attempts to win, tries to win], tr: [kazanmak için deneme]}
    unit: ratio
    better: down
    model: fct_sdk_level_funnel
    value: avg_attempts_to_win
    filter: avg_attempts_to_win IS NOT NULL
    dims: [level]
    aggregation: latest
    sample: players_completed
    definition: mean of each player's attempt number on their first level_complete
  sdk_quit_inferred:
    name: {en: inferred mid-level quits, tr: seviye ortasında bırakma}
    synonyms: {en: [mid-level quits, quit mid level, killed mid level], tr: [seviye ortasında çıkış]}
    unit: count
    better: down
    model: fct_sdk_level_funnel
    value: quit_inferred
    dims: [level]
    aggregation: latest
    definition: sessions whose last level event is a level_start with no outcome
  sdk_level_churn_rate:
    name: {en: SDK churn at level, tr: SDK seviyede bırakma oranı}
    unit: pct
    better: down
    model: fct_sdk_level_funnel
    value: churn_rate
    dims: [level]
    aggregation: pooled
    numerator: churned_here
    denominator: players_reached
    sample: players_reached
    definition: churned installs whose highest started level is this one / installs reaching it
  sdk_error_events:
    name: {en: error events by type, tr: türe göre hata olayı}
    synonyms: {en: [most frequent error, most common error, top errors, errors by type], tr: [en sık hata, en sık görülen hata, en çok görülen hata, hata türleri]}
    unit: count
    better: down
    model: fct_sdk_errors
    value: events
    dims: [type]
    aggregation: latest
    sample: sessions
    definition: pulse_error events per exception type over the loaded window (SDK apps; the type is text from the app)
  sdk_purchase_revenue:
    name: {en: revenue by product, tr: ürüne göre gelir}
    synonyms: {en: [product revenue, best selling product, top product], tr: [ürün geliri, en çok satan ürün, en çok gelir getiren ürün]}
    unit: usd
    better: up
    model: fct_sdk_purchases
    value: revenue_usd
    dims: [product_id]
    aggregation: latest
    sample: purchases
    definition: purchase revenue per product (SDK apps; sandbox and restores excluded)
  sdk_ad_revenue:
    name: {en: ad revenue by format, tr: biçime göre reklam geliri}
    synonyms: {en: [rewarded ad revenue, interstitial revenue, banner revenue], tr: [ödüllü reklam geliri, geçiş reklamı geliri]}
    unit: usd
    better: up
    model: fct_sdk_ad_revenue_daily
    time: date
    value: revenue_usd
    dims: [ad_format]
    aggregation: sum
    sample: impressions
    definition: ad_impression values in USD per ad format (SDK apps)
  sdk_ad_ecpm:
    name: {en: eCPM by ad format, tr: reklam biçimine göre eCPM}
    synonyms: {en: [rewarded ecpm, interstitial ecpm], tr: [ödüllü ecpm, geçiş reklamı ecpm]}
    unit: usd
    better: up
    model: fct_sdk_ad_revenue_daily
    time: date
    value: ecpm_usd
    dims: [ad_format]
    aggregation: pooled
    numerator: revenue_usd * 1000
    denominator: impressions
    sample: impressions
    definition: ad revenue x 1000 / impressions per ad format (SDK apps)
  sdk_duplicate_rate:
    name: {en: duplicate event rate, tr: yinelenen olay oranı}
    synonyms: {en: [duplicates, duplicate rate], tr: [yinelenen olay, çift olay]}
    unit: pct
    better: down
    model: fct_sdk_data_quality
    value: duplicate_rate
    aggregation: latest
    sample: raw_events
    definition: raw rows the warehouse dedupe removed / raw rows (SDK apps)
  sdk_seq_loss_rate:
    name: {en: event loss rate, tr: olay kaybı oranı}
    synonyms: {en: [sequence loss, lost events], tr: [kayıp olay]}
    unit: pct
    better: down
    model: fct_sdk_data_quality
    value: seq_loss_rate
    aggregation: latest
    definition: 1 - received / expected sequence numbers per install (contract v2 rows)
  sdk_skewed_share:
    name: {en: clock-skewed event share, tr: saati kaymış olay payı}
    synonyms: {en: [clock skew, skewed events], tr: [saat kayması]}
    unit: pct
    better: down
    model: fct_sdk_data_quality
    value: skewed_share
    aggregation: latest
    definition: events whose device clock was more than 10 minutes off
  sdk_quarantine_rate:
    name: {en: quarantine rate, tr: karantina oranı}
    synonyms: {en: [quarantined events], tr: [karantinaya alınan olay]}
    unit: pct
    better: down
    model: fct_sdk_data_quality
    value: quarantine_rate
    aggregation: latest
    definition: quarantined / (stored + quarantined) events

# model.column references of docs/METRICS.md that are not metrics themselves
# (flags, intermediate values, internal staging columns).
not_metrics:
  - fct_retention.is_complete
  - stg_rc_transactions.revenue_usd
  - stg_rc_transactions.proceeds_usd
  - stg_ua_cohort_cum.cum_revenue_usd
