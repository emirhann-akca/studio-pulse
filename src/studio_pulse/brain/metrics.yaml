    filter: roas_d0 IS NOT NULL
    dims: [network, campaign_name]
    aggregation: pooled
    numerator: revenue_d0_usd
    denominator: spend_usd
    sample: installs
    definition: cohort revenue on the install day / spend of that day
    headline: {metric: pooled_roas, where: {network: '(all)', campaign_name: '(all)', day_n: 0}}
    default_days: 30
  roas_d30:
    name: {en: D30 ROAS, tr: D30 ROAS}
    synonyms: {en: [day 30 roas, return on ad spend day 30], tr: [30. gün roas]}
    unit: pct
    better: up
    model: fct_ua_cohort_roas
    time: cohort_date
    value: roas_d30
    filter: roas_d30 IS NOT NULL
    dims: [network, campaign_name]
    aggregation: pooled
    numerator: revenue_d30_usd
    denominator: spend_usd
    sample: installs
    definition: cohort revenue by day 30 / spend of that day (cohorts that reached day 30)
    headline: {metric: pooled_roas, where: {network: '(all)', campaign_name: '(all)', day_n: 30}}
    default_days: 30
  pooled_roas:
    name: {en: pooled ROAS curve, tr: havuzlanmış ROAS eğrisi}
    synonyms: {en: [roas curve], tr: [roas eğrisi]}
    unit: pct
    better: up
    model: fct_ua_roas_curve
    value: roas
    dims: [network, campaign_name, day_n]
