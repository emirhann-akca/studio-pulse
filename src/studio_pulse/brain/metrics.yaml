# Metric catalog: the machine-readable form of docs/METRICS.md.
#
# One entry per metric. The brain (insight jobs, Q&A router, number verifier)
# reads only this file; alerts.py keeps its own series SQL, and the test
# tests/test_brain_catalog.py proves that both give the same rows on the demo
# warehouse and that every metric of alerts.METRICS and every `model.column`
# of docs/METRICS.md is here.
#
# Fields
#   name / synonyms   English and Turkish; synonyms feed the Q&A router
#   unit              count | pct (a share 0..1) | usd | ms | mb | ratio | days
#   better            up | down (direction of a good change); none for neutral
#   model / value     the table and the per-row value (column or expression)
#   time              date column of the model (none for snapshot tables)
#   filter            always applied (SQL boolean over the model's columns)
#   dims              extra key columns of the model a question may break down by
#   aggregation       how several rows combine into one number:
#                       pooled         sum(numerator) / sum(denominator)
#                       sum            additive count or amount
#                       mean_of_daily  mean of the daily values (levels: DAU, ms)
#                       latest         the newest row (snapshots, curves)
#   numerator / denominator   for pooled (expressions; value * weight is exact)
#   sample            the row's sample size (users, windows, ...) for alerts and n
#   alert             the series alerts.py evaluates for this metric:
#                       dims      dimension columns the series keeps
#                       baseline  pooled | mean_of_daily: how drop/rise rules
#                                 combine the trailing baseline and the
#                                 evaluated days. pooled is used only where
#                                 the series' sample is the ratio's denominator.
#   pull_dims         dimensions available through the cohort_dims pull (B3)
#
# The D1 baseline was the research's example of one name with two numbers
# (mean of daily rates 26.76% vs pooled 26.79%): retention is pooled
# everywhere now, in fct_retention_summary, in alert baselines and in the brain.

version: 1

dimensions:
  app_id:
    name: {en: app, tr: uygulama}
    synonyms: {en: [game, application], tr: [oyun, uygulama]}
  date:
    name: {en: day, tr: gün}
    synonyms: {en: [date, daily], tr: [tarih, günlük]}
  cohort_date:
    name: {en: install cohort day, tr: kurulum kohortu günü}
    synonyms: {en: [cohort, install day], tr: [kohort, kurulum günü]}
  platform:
    name: {en: platform, tr: platform}
    synonyms: {en: [os, android or ios, android and ios, ios and android, android vs ios], tr: [platforma göre, platform bazında, işletim sistemi, android mi ios mu, android ve ios, ios ve android, android ile ios]}
    tables: [stg_cohort_days, stg_cohort_dims]
  country:
    name: {en: country, tr: ülke}
    synonyms: {en: [geo, market, region], tr: [ülkeye göre, pazar, bölge]}
    tables: [stg_cohort_dims]
  app_version:
    name: {en: app version, tr: uygulama sürümü}
    synonyms: {en: [version, release, build], tr: [sürüm, versiyon, yayın]}
    tables: [fct_perf_by_version, fct_rating_by_version, stg_cohort_dims]
  network:
    name: {en: first-touch source, tr: ilk temas kaynağı}
    synonyms: {en: [ad network, network, channel, traffic source, first-touch source], tr: [reklam ağı, ağ, kanal, trafik kaynağı, ilk temas kaynağı]}
    tables: [fct_ua_daily, fct_ua_summary, stg_cohort_dims]
  device_tier:
    name: {en: device tier, tr: cihaz sınıfı}
    synonyms: {en: [tier, low-end, low end, device class, devices], tr: [cihaz, düşük seviye, yüksek seviye, cihaz seviyesi, telefon sınıfı]}
    tables: [fct_perf_daily, fct_perf_by_tier, fct_perf_by_version, stg_cohort_dims]
  level:
    name: {en: level, tr: seviye}
    synonyms: {en: [stage, puzzle level], tr: [bölüm, level]}
    tables: [fct_level_funnel]
  network_campaign:
    name: {en: campaign, tr: kampanya}
    synonyms: {en: [campaign name, ad campaign], tr: [kampanya adı, reklam kampanyası]}
    tables: [fct_ua_daily, fct_ua_summary]
  store:
    name: {en: store, tr: mağaza}
    synonyms: {en: [play store, app store], tr: [play mağazası, app store]}
    tables: [fct_review_daily]
  ad_format:
    name: {en: ad format, tr: reklam biçimi}
    synonyms: {en: [ad type], tr: [reklam türü]}
    tables: [fct_sdk_ad_revenue_daily]
  setting:
    name: {en: setting, tr: ayar}
    synonyms: {en: [settings], tr: [ayarlar]}
    tables: [fct_sdk_settings]
  product_id:
    name: {en: product, tr: ürün}
    synonyms: {en: [products, sku], tr: [ürünler]}
    tables: [fct_sdk_purchases]
  topic:
    name: {en: review topic, tr: yorum konusu}
    synonyms: {en: [review topics], tr: [yorum konuları]}
    tables: [fct_review_topics]
  creative_key:
    name: {en: creative, tr: kreatif}
    synonyms: {en: [creatives, ad creative], tr: [kreatifler, reklam kreatifi]}
    tables: [fct_creative_scorecard]
  experiment_id:
    name: {en: experiment, tr: deney}
    tables: [fct_experiment_tests, fct_experiment_arms]
  horizon_day:
    name: {en: prediction horizon, tr: tahmin ufku}
    tables: [fct_pltv_summary]
  type:
    name: {en: error type, tr: hata türü}
    tables: [fct_sdk_errors]
  source:
    name: {en: data source, tr: veri kaynağı}
    tables: [fct_source_freshness]

metrics:
  # -- activity --------------------------------------------------------------
  dau:
    name: {en: daily active users, tr: günlük aktif kullanıcı}
    synonyms: {en: [dau, active users, daily users, active players], tr: [dau, aktif kullanıcı, günlük kullanıcı, aktif oyuncu]}
    unit: count
    better: up
    model: fct_app_daily
    time: date
    value: dau
    filter: dau IS NOT NULL
    aggregation: mean_of_daily
    sample: dau
    alert: {baseline: mean_of_daily}
    definition: distinct active users per day (passive events excluded)
    sources:
      - model: stg_active_users
        dims: [platform]
  wau:
    name: {en: weekly active users, tr: haftalık aktif kullanıcı}
    synonyms: {en: [wau], tr: [wau]}
    unit: count
    better: up
    model: fct_app_daily
    time: date
    value: wau
    aggregation: latest
    definition: distinct active users in the 7 days ending that day
  mau:
    name: {en: monthly active users, tr: aylık aktif kullanıcı}
    synonyms: {en: [mau], tr: [mau]}
    unit: count
    better: up
    model: fct_app_daily
    time: date
    value: mau
    aggregation: latest
    definition: distinct active users in the 30 days ending that day
  stickiness:
    name: {en: stickiness (DAU/MAU), tr: yapışkanlık (DAU/MAU)}
    synonyms: {en: [dau/mau, dau over mau], tr: [dau/mau]}
    unit: pct
    better: up
    model: fct_app_daily
    time: date
    value: stickiness
    aggregation: latest
    definition: DAU / MAU
  new_users:
    name: {en: new users, tr: yeni kullanıcı}
    synonyms: {en: [installs, first opens, new players, acquisitions], tr: [yeni oyuncu, kurulum, ilk açılış, yeni gelen]}
    unit: count
    better: up
    model: fct_app_daily
    time: date
    value: new_users
    filter: new_users IS NOT NULL
    aggregation: sum
    sample: dau
    alert: {baseline: mean_of_daily}
    definition: active users who logged first_open (or first_visit) that day
    sources:
      - model: stg_active_users
        dims: [platform]
  store_installs:
    name: {en: store installs, tr: mağaza kurulumu}
    synonyms: {en: [play installs, app store installs, downloads, store downloads], tr: [indirme, mağaza indirmesi, indirildi, indirme sayısı, mağazadan indirme]}
    unit: count
    better: up
    model: fct_app_daily
    time: date
    value: store_installs
    aggregation: sum
    definition: Play daily user installs / App Store units of first-time product types
  store_uninstalls:
    name: {en: store uninstalls, tr: mağaza kaldırma}
    synonyms: {en: [uninstalls, removals], tr: [kaldırma, kaldıran, uygulamayı silen]}
    unit: count
    better: down
    model: fct_app_daily
    time: date
    value: store_uninstalls
    aggregation: sum
    definition: uninstalls reported by the store (Play daily user uninstalls)
  ad_impressions:
    name: {en: ad impressions, tr: reklam gösterimi}
    synonyms: {en: [ads shown, impressions served], tr: [reklam gösterimleri, gösterilen reklam]}
    unit: count
    better: up
    model: fct_app_daily
    time: date
    value: ad_impressions
    aggregation: sum
    definition: AdMob ad impressions per day
  sessions:
    name: {en: sessions, tr: oturum}
    synonyms: {en: [session count], tr: [oturum sayısı]}
    unit: count
    better: up
    model: fct_app_daily
    time: date
    value: sessions
    aggregation: sum
    definition: distinct (user, ga_session_id) pairs per day
    sources:
      - model: stg_active_users
        dims: [platform]
  sessions_per_dau:
    name: {en: sessions per DAU, tr: DAU başına oturum}
    synonyms: {en: [sessions per user, session frequency, sessions per daily user, sessions per player], tr: [kullanıcı başına oturum, oturum sıklığı, günlük kullanıcı başına oturum]}
    unit: ratio
    better: up
    model: fct_app_daily
    time: date
    value: sessions_per_dau
    aggregation: pooled
    numerator: sessions
    denominator: dau
    sample: dau
    alert: {baseline: pooled}
    definition: sessions / DAU
    sources:
      - model: stg_active_users
        dims: [platform]
        value: "sessions / NULLIF(dau, 0)"
  engagement_min_per_dau:
    name: {en: engagement minutes per DAU, tr: DAU başına etkileşim dakikası}
    synonyms: {en: [playtime, time spent, minutes per user, engagement minutes, minutes per daily user], tr: [oynama süresi, kullanıcı başına dakika, geçirilen süre, kaç dakika oynanıyor, kullanıcı başına kaç dakika]}
    unit: ratio
    better: up
    model: fct_app_daily
    time: date
    value: engagement_min_per_dau
    aggregation: pooled
    numerator: engagement_sec / 60.0
    denominator: dau
    definition: sum(engagement_time_msec) / 60000 / DAU
    sources:
      - model: stg_active_users
        dims: [platform]
        value: "engagement_sec / 60.0 / NULLIF(dau, 0)"

  # -- retention -------------------------------------------------------------
  cohort_size:
    name: {en: install cohort size, tr: kurulum kohortu büyüklüğü}
    synonyms: {en: [cohort size, cohort users], tr: [kohort büyüklüğü, kohort kullanıcısı]}
    unit: count
    better: up
    model: fct_retention
    time: cohort_date
    value: cohort_size
    filter: day_n = 0
    aggregation: sum
    definition: users of the install cohort active on day 0
  d1_retention:
    name: {en: D1 retention, tr: D1 elde tutma}
    synonyms: {en: [day 1 retention, d1, next-day retention, retention d1, day-one retention], tr: [1. gün elde tutma, d1 tutma, ertesi gün dönüş, birinci gün tutunma, d1 retention, 1. gün tutma]}
    unit: pct
    better: up
    model: fct_retention
    time: cohort_date
    value: retention
    filter: day_n = 1 AND is_complete
    aggregation: pooled
    numerator: retained_users
    denominator: cohort_size
    sample: cohort_size
    alert: {baseline: pooled}
    pull_dims: [platform, country, app_version, network, device_tier]
    definition: users of the install cohort active exactly on day 1 / cohort size (classic day-N)
    headline: {metric: headline_retention, where: {day_n: 1}}
  d7_retention:
    name: {en: D7 retention, tr: D7 elde tutma}
    synonyms: {en: [day 7 retention, d7, week-one retention, retention d7], tr: [7. gün elde tutma, d7 tutma, d7 retention, 7. gün tutma, haftalık tutunma]}
    unit: pct
    better: up
    model: fct_retention
    time: cohort_date
    value: retention
    filter: day_n = 7 AND is_complete
    aggregation: pooled
    numerator: retained_users
    denominator: cohort_size
    sample: cohort_size
    alert: {baseline: pooled}
    pull_dims: [platform, country, app_version, network, device_tier]
    definition: users of the install cohort active exactly on day 7 / cohort size
    headline: {metric: headline_retention, where: {day_n: 7}}
  d14_retention:
    name: {en: D14 retention, tr: D14 elde tutma}
    synonyms: {en: [day 14 retention, d14], tr: [14. gün elde tutma, d14 tutma, 14. gün tutma]}
    headline: {metric: headline_retention, where: {day_n: 14}}
    unit: pct
    better: up
    model: fct_retention
    time: cohort_date
    value: retention
    filter: day_n = 14 AND is_complete
    aggregation: pooled
    numerator: retained_users
    denominator: cohort_size
    sample: cohort_size
    definition: users of the install cohort active exactly on day 14 / cohort size
  d30_retention:
    name: {en: D30 retention, tr: D30 elde tutma}
    synonyms: {en: [day 30 retention, d30, month-one retention], tr: [30. gün elde tutma, d30 tutma, aylık tutunma]}
    unit: pct
    better: up
    model: fct_retention
    time: cohort_date
    value: retention
    filter: day_n = 30 AND is_complete
    aggregation: pooled
    numerator: retained_users
    denominator: cohort_size
    sample: cohort_size
    pull_dims: [platform, country, app_version, network, device_tier]
    definition: users of the install cohort active exactly on day 30 / cohort size
    headline: {metric: headline_retention, where: {day_n: 30}}
  headline_retention:
    name: {en: headline retention (28 cohorts), tr: özet elde tutma (28 kohort)}
    synonyms: {en: [headline d1, retention summary], tr: [özet tutunma]}
    unit: pct
    better: up
    model: fct_retention_summary
    value: retention
    dims: [day_n]
    aggregation: latest
    sample: cohort_users
    definition: pooled day-N retention over the 28 most recent complete cohorts

  # -- revenue ---------------------------------------------------------------
  revenue_usd:
    name: {en: net revenue, tr: net gelir}
    synonyms: {en: [revenue, income, earnings, money, sales], tr: [gelir, kazanç, hasılat, para, ciro]}
    unit: usd
    better: up
    model: fct_app_daily
    time: date
    value: revenue_usd
    filter: dau IS NOT NULL
    aggregation: sum
    sample: dau
    alert: {baseline: mean_of_daily}
    definition: IAP revenue + ad revenue (USD)
  iap_revenue_usd:
    name: {en: IAP revenue, tr: uygulama içi satın alma geliri}
    synonyms: {en: [in-app purchase revenue, iap, purchases revenue], tr: [iap geliri, satın alma geliri]}
    unit: usd
    better: up
    model: fct_app_daily
    time: date
    value: iap_revenue_usd
    aggregation: sum
    definition: RevenueCat proceeds, or GA4 purchase values (gross) without RevenueCat
  ad_revenue_usd:
    name: {en: ad revenue, tr: reklam geliri}
    synonyms: {en: [ads revenue, admob revenue], tr: [reklam kazancı, admob geliri]}
    unit: usd
    better: up
    model: fct_app_daily
    time: date
    value: ad_revenue_usd
    aggregation: sum
    definition: AdMob estimated earnings, or GA4 ad_impression values without AdMob
  ad_revenue_share:
    name: {en: ad share of revenue, tr: gelirde reklam payı}
    synonyms: {en: [share of revenue from ads, ad revenue share, ads share of revenue, revenue came from ads, came from ads], tr: [reklam payı, gelirin reklam payı, reklamdan gelen pay, gelirin ne kadarı reklamdan, reklamdan geldi]}
    unit: pct
    better: none
    model: fct_app_daily
    time: date
    value: ad_revenue_usd / NULLIF(revenue_usd, 0)
    aggregation: pooled
    numerator: ad_revenue_usd
    denominator: revenue_usd
    definition: ad revenue / (IAP + ad revenue), pooled over the period
  arpdau:
    name: {en: ARPDAU, tr: ARPDAU}
    synonyms: {en: [average revenue per daily active user, revenue per user, arpu per day], tr: [günlük aktif kullanıcı başına gelir, kullanıcı başına gelir]}
    unit: usd
    better: up
    model: fct_app_daily
    time: date
    value: arpdau
    aggregation: pooled
    numerator: revenue_usd
    denominator: dau
    sample: dau
    alert: {baseline: pooled}
    definition: net revenue / DAU
  payers:
    name: {en: payers, tr: ödeme yapan}
    synonyms: {en: [paying users, buyers, paying players], tr: [ödeyen kullanıcı, alıcı, ödeme yapan kullanıcı sayısı]}
    unit: count
    better: up
    model: fct_app_daily
    time: date
    value: payers
    aggregation: sum
    definition: distinct customers with revenue > 0 that day
  payer_conversion:
    name: {en: payer conversion, tr: ödeyen dönüşümü}
    synonyms: {en: [conversion to payer, paying share, payer rate per day, share of paying users], tr: [ödeme dönüşümü, ödeyen oranı, ödeme yapan kullanıcı oranı, ödeyen kullanıcı oranı]}
    unit: pct
    better: up
    model: fct_app_daily
    time: date
    value: payer_conversion
    aggregation: pooled
    numerator: payers
    denominator: dau
    sample: dau
    alert: {baseline: pooled}
    definition: payers / DAU
  ecpm_usd:
    name: {en: eCPM, tr: eCPM}
    synonyms: {en: [ecpm, revenue per thousand impressions], tr: [bin gösterim başına gelir]}
    unit: usd
    better: up
    model: fct_app_daily
    time: date
    value: ecpm_usd
    aggregation: pooled
    numerator: ecpm_usd * ad_impressions
    denominator: ad_impressions
    sample: ad_impressions
    alert: {baseline: pooled}
    definition: AdMob earnings x 1000 / impressions
  ltv_usd:
    name: {en: cumulative ARPU (LTV curve), tr: kümülatif ARPU (LTV eğrisi)}
    synonyms: {en: [ltv, lifetime value, cumulative arpu, cumulative revenue per user], tr: [yaşam boyu değer, kümülatif gelir, kullanıcı başına kümülatif gelir]}
    unit: usd
    better: up
    model: fct_ltv_curve
    value: cumulative_arpu_usd
    dims: [day_n]
    aggregation: latest
    sample: cohort_users
    definition: revenue of eligible cohorts by day N / their size (complete cohorts only)
  payer_rate:
    name: {en: cohort payer rate, tr: kohort ödeyen oranı}
    synonyms: {en: [share who paid], tr: [ödeme yapanların payı]}
    unit: pct
    better: up
    model: fct_ltv_curve
    value: payer_rate
    dims: [day_n]
    aggregation: latest
    sample: cohort_users
    definition: users of eligible cohorts who paid by day N / their size

  # -- stability -------------------------------------------------------------
  crashed_users:
    name: {en: crashed users, tr: çöken kullanıcı}
    synonyms: {en: [users with a crash], tr: [çökme yaşayan kullanıcı]}
    unit: count
    better: down
    model: fct_app_daily
    time: date
    value: crashed_users
    aggregation: sum
    definition: users with a fatal crash that day (Crashlytics or GA4 app_exception)
    sources:
      - model: stg_active_users
        dims: [platform]
  crash_free_users:
    name: {en: crash-free users, tr: çökmesiz kullanıcı oranı}
    synonyms: {en: [crash free users, stability, crash-free rate, crashing, crashes more], tr: [çökmesiz kullanıcı, kararlılık, çökme oranı, çökmeler, çöküyor]}
    unit: pct
    better: up
    model: fct_app_daily
    time: date
    value: crash_free_users
    aggregation: pooled
    numerator: crash_free_users * dau
    denominator: dau
    sample: dau
    alert: {baseline: pooled}
    definition: 1 - min(crashed users, DAU) / DAU
    sources:
      - model: stg_active_users
        dims: [platform]
        value: "1 - LEAST(crashed_users, dau) / NULLIF(dau, 0)"
        numerator: "dau - LEAST(crashed_users, dau)"
  crash_free_sessions:
    name: {en: crash-free sessions, tr: çökmesiz oturum oranı}
    synonyms: {en: [crash free sessions], tr: [çökmesiz oturum]}
    unit: pct
    better: up
    model: fct_app_daily
    time: date
    value: crash_free_sessions
    aggregation: pooled
    numerator: crash_free_sessions * sessions
    denominator: sessions
    sample: sessions
    alert: {baseline: pooled}
    definition: 1 - min(fatal crash events, sessions) / sessions
    sources:
      - model: stg_active_users
        dims: [platform]
        value: "1 - LEAST(crashed_sessions, sessions) / NULLIF(sessions, 0)"
        numerator: "sessions - LEAST(crashed_sessions, sessions)"
  crash_free_users_7d:
    name: {en: 7-day crash-free users, tr: 7 günlük çökmesiz kullanıcı}
    synonyms: {en: [weekly crash-free users], tr: [haftalık çökmesiz kullanıcı]}
    unit: pct
    better: up
    model: fct_app_summary
    value: crash_free_users_7d
    aggregation: latest
    definition: 1 - sum(min(crashed users, DAU)) / sum(DAU) over the last 7 days
  vitals_crash_rate:
    name: {en: Play user-perceived crash rate, tr: Play kullanıcı tarafından görülen çökme oranı}
    synonyms: {en: [android vitals crash rate, play crash rate, user-perceived crash rate, user perceived crash rate], tr: [play çökme oranı, android vitals çökme, kullanıcının gördüğü çökme oranı]}
    unit: pct
    better: down
    model: fct_android_vitals_daily
    time: date
    value: user_perceived_crash_rate
    aggregation: pooled
    numerator: user_perceived_crash_rate * distinct_users
    denominator: distinct_users
    sample: distinct_users
    alert: {baseline: pooled}
    definition: Play Developer Reporting API, user-perceived crash rate (daily)
  anr_rate:
    name: {en: Play user-perceived ANR rate, tr: Play kullanıcı tarafından görülen ANR oranı}
    synonyms: {en: [anr, app not responding], tr: [anr, uygulama yanıt vermiyor]}
    unit: pct
    better: down
    model: fct_android_vitals_daily
    time: date
    value: user_perceived_anr_rate
    aggregation: pooled
    numerator: user_perceived_anr_rate * distinct_users
    denominator: distinct_users
    sample: distinct_users
    alert: {baseline: pooled}
    definition: Play Developer Reporting API, user-perceived ANR rate (daily)

  # -- client performance ----------------------------------------------------
  frame_time_p50_ms:
    name: {en: median frame time, tr: medyan kare süresi}
    synonyms: {en: [frame time, fps, frame rate, smoothness, jank, lag], tr: [kare süresi, fps, kare hızı, akıcılık, kasma, takılma]}
    unit: ms
    better: down
    model: fct_perf_daily
    time: date
    value: ft_p50_ms
    dims: [device_tier]
