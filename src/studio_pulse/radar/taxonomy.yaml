# Market radar taxonomy (research report 3.4).
# Mechanics map to GameRefinery's public Casual > Puzzle subgenres (docs.gamerefinery.com,
# "Puzzle", page dated 30 Sep 2024) plus the niche subgenres GameRefinery does not split out
# (sort, screw, jam, block; Naavik x Sensor Tower, 22 Feb 2026), and to creative-forge's
# `mechanic_shown` vocabulary (color-sort, screw-pin and jam were added there for the radar).
#
# keywords: lower-case phrases for the deterministic keyword tagger (whole-word match in the
# title, Play tags and description). The quote of a keyword claim is the matched text itself.
version: 1
mechanics:
  match-3:          {gamerefinery: Match3, forge: match-3, keywords: [match 3, match-3, match three, swap and match, match3]}
  tile-match:       {gamerefinery: Other puzzle, forge: tile-match, keywords: [tile match, triple match, match 3 tiles, triple tile, tile puzzle, mahjong match]}
  goods-sort:       {gamerefinery: Other puzzle, forge: goods-sort, keywords: [goods sort, sort goods, goods sorting, sorting goods, shelf sort, sort the goods, item sort]}
  color-sort:       {gamerefinery: Other puzzle, forge: color-sort, keywords: [color sort, colour sort, ball sort, water sort, liquid sort, sort the colors, sort the colours]}
  hexa-sort:        {gamerefinery: Other puzzle, forge: other, keywords: [hexa sort, hexa stack, stack sort, hexagon sort]}
  screw-pin:        {gamerefinery: Action Puzzle, forge: screw-pin, keywords: [screw, screws, unscrew, bolts, nuts and bolts, pin puzzle, pull the pin]}
  jam:              {gamerefinery: Other puzzle, forge: jam, keywords: [bus jam, car jam, parking jam, traffic jam, color block jam, block jam, seat jam, jam puzzle]}
  block-puzzle:     {gamerefinery: Other puzzle, forge: block-puzzle, keywords: [block puzzle, block blast, blocks puzzle, place the blocks, wood block]}
  merge:            {gamerefinery: Merge, forge: merge, keywords: [merge, merging]}
  bubble-shooter:   {gamerefinery: Bubble Shooter, forge: other, keywords: [bubble shooter, bubble pop, pop bubbles]}
  word:             {gamerefinery: Word Games, forge: word, keywords: [word game, word puzzle, crossword, word search, spell words]}
  hidden-object:    {gamerefinery: Hidden Objects, forge: hidden-object, keywords: [hidden object, find the differences, spot the difference, find hidden]}
  solitaire-mahjong: {gamerefinery: Solitaire/Mahjong, forge: other, keywords: [solitaire, mahjong, klondike, tripeaks]}
  number-logic:     {gamerefinery: Other puzzle, forge: other, keywords: [sudoku, nonogram, number puzzle, logic puzzle]}
  physics-draw:     {gamerefinery: Action Puzzle, forge: physics, keywords: [draw a line, draw to, physics puzzle, physics-based]}
  idle-tycoon:      {gamerefinery: Simulation, forge: idle, keywords: [idle, tycoon, management, manage your]}
  runner:           {gamerefinery: Arcade, forge: runner, keywords: [endless runner, runner, run and jump]}
  cooking-sim:      {gamerefinery: Simulation, forge: other, keywords: [cooking game, cooking simulation, restaurant game, serve customers, cooking simulator]}
