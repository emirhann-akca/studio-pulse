# Curated publisher watch lists for the market radar (docs/RADAR.md, "New launches").
# Opt-in: `radar.publisher_preset: casual` adds every publisher below to `radar.publishers`.
#
# Each entry is an App Store artistId with the artistName Apple returned for it. How the ids
# were found and checked (16 Nov 2026, 50 requests in all, at least 3.5 s apart):
#   1. twelve public chart pages, apps.apple.com/{us,tr,gb}/iphone/charts/{genre} (robots.txt
#      allows them), and batched iTunes Lookups of the apps on them (about 3,000 storefront
#      rows, 1,306 distinct developers), which give each app's artistId and artistName;
#   2. one batched Lookup of the candidate ids (itunes.apple.com/lookup?id=<ids>): every id
#      below answered wrapperType "artist", artistType "Software Artist" and exactly the
#      artist_name written here.
# The Search API is not used: itunes.apple.com/robots.txt disallows /search*.
# Never add an id that was not checked this way (tests/test_radar_launches.py checks the shape).
#
# Not listed: publishers with no app in the charts read on 16 Nov 2026, so no artistId could
# be verified without guessing (Bigger Games, Fomo Games, Machina Games, Magic Games, Sonat,
# Spyke, Tuna Games, Whalo). Add one by hand once a chart or a Lookup shows its id.
version: 1
presets:
  casual:
    title: Casual, hybrid-casual and puzzle publishers
    publishers:
