# Benchmarks and assumptions used by the game dossier's "Yapmalı mıyız? / Should we make it?"
# card (radar/dossier/rubric.py). Every block says where its numbers come from. Override any
# block in the config under radar.dossier (docs/RADAR.md, "Game dossier").
version: 1

# Cost per install by genre, country and platform (USD).
