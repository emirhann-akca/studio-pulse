# Radar mechanic (taxonomy.yaml) -> AppsFlyer genre. An approximation: AppsFlyer does not
# publish its genre definitions. Mechanics not listed fall back to the Apple primary genre.
mechanic_genre:
  match-3: match
  tile-match: puzzle
  goods-sort: puzzle
  color-sort: puzzle
  hexa-sort: puzzle
  screw-pin: puzzle
  jam: puzzle
  block-puzzle: puzzle
  merge: puzzle
  bubble-shooter: puzzle
  word: puzzle
  hidden-object: puzzle
  solitaire-mahjong: puzzle
  number-logic: puzzle
  physics-draw: hypercasual
  runner: hypercasual
  idle-tycoon: simulation
  cooking-sim: simulation
apple_genre:
  Puzzle: puzzle
  Simulation: simulation
  Action: action
  Adventure: action
  Racing: action
  Role Playing: rpg
  Strategy: strategy
  Sports: sports
  Casino: casino

# Production effort for a soft-launchable first version, in person-months. A STUDIO ASSUMPTION
# (no public source measures this): edit it under radar.dossier.effort for your own team.
# The dossier multiplies the base by the adders the deconstruction found and shows a +-35 % range.
effort:
  base:
    color-sort: 2.0
    block-puzzle: 2.0
    number-logic: 2.0
    physics-draw: 2.0
    screw-pin: 2.5
    jam: 2.5
    hexa-sort: 2.5
    tile-match: 2.5
    runner: 2.5
    goods-sort: 3.0
    bubble-shooter: 3.0
    word: 3.0
    solitaire-mahjong: 3.0
    merge: 4.0
    hidden-object: 4.0
    idle-tycoon: 4.0
    cooking-sim: 4.0
    match-3: 5.0
    unknown: 6.0
  adders:          # multiplier added per signal found
    meta_layer: 0.25     # each grounded meta-layer claim type (decorate, story, collection ...)
    liveops: 0.20        # grounded LiveOps signals (events, seasons, leagues)
    art_3d: 0.30         # a 3D art style
    pvp: 0.60            # real-time or async PvP needs servers and matchmaking
  range: 0.35

