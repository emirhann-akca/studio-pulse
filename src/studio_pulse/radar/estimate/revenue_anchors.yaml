  appmagic_tr_2026: {title: "AppMagic, Turkiye Mobile Gaming Landscape 2026", url: "https://appmagic.rocks/files/view/upload/Reports/Turkiye_Mobile_Gaming_Landscape_2026.pdf", published: "2026-04-01"}
