  esa_2025: {title: "ESA: 2025 U.S. consumer spending on video games ($26.7B mobile, Sensor Tower)", url: "https://www.theesa.com/2025-u-s-consumer-spending-on-video-games-nears-pandemic-level-peak-at-60-7-billion-second-highest-on-record/", published: "2026-02-11"}
