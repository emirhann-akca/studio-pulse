  roblox_q3_2026_10q: {title: "Roblox Form 10-Q, quarter ended 30 Sep 2026", url: "https://www.sec.gov/Archives/edgar/data/1315098/000162828026068253/rblx-20260930.htm", published: "2026-10-29"}
  roblox_fy2025_10k: {title: "Roblox Form 10-K 2025", url: "https://www.sec.gov/Archives/edgar/data/1315098/000131509826000024/rblx-20251231.htm", published: "2026-02-11"}
  playtika_q3_2026: {title: "Playtika Holding Corp. reports Q3 2026 financial results (GlobeNewswire copy)", url: "https://finviz.com/news/416606/playtika-holding-corp-reports-q3-2026-financial-results", published: "2026-11-05"}
  playtika_fy2025_10k: {title: "Playtika Form 10-K 2025", url: "https://www.sec.gov/Archives/edgar/data/1828016/000182801626000010/playtika-20251231.htm", published: "2026-02-26"}
