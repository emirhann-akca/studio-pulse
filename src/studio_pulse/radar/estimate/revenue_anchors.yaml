  era_2025: {title: "PocketGamer.biz: UK games spending hits GBP 5.4bn in 2025 (ERA)", url: "https://www.pocketgamer.biz/uk-games-spending-hits-54bn-in-2025-as-mobile-powers-strongest-growth-since-2020/", published: "2026-01-07"}
