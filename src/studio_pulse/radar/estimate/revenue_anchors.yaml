# Top-grossing rank -> daily iOS revenue (radar/estimate/revenue.py, docs/RADAR.md
# "Market estimates"). Public figures only: company filings and press releases (anchors),
# published rank-sales research (slope), trade-body / analytics-firm market sizes (country
# scale). Every figure was read on the cited page on the retrieval date. Anything not
# disclosed is an explicit range marked `assumption`; the bands carry all of them.
#
# Model: revenue/day of the game at rank r in country c's iPhone Top Grossing Games list
#   R_c(r) = A_us * m_c * r^(-b)
#   b      ~ uniform(slope.low, slope.high)                       (research)
#   A_us   = geometric mean over US anchors of daily_a * r_a^b      (anchors)
#   m_c    = iOS game spend of c / iOS game spend of the US        (market_size)
# plus a game-to-game spread (the anchors' scatter around the curve, floor `sigma_floor`).
# Units: USD per day, gross consumer spend through the App Store.
version: 1
retrieved: "2026-11-14"
list: "topgrossingapplications:6014"
currency: USD

slope:
  low: 0.60
  high: 0.95
  basis: >-
    Garg & Telang (2013) fit 0.860 for iPhone top grossing (iPad 0.886) on 2011 data; a 2026
    practitioner fit to US iPhone grossing uses 0.62-0.72 (non-peer-reviewed); book sales
    rank studies imply ~0.83. The band spans them with a margin.
  sources: [garg_telang_2013, apify_gazidev, chevalier_goolsbee_2003]
sigma_floor: 0.5   # natural-log spread of games around the curve, at least (anchors are few)

fx:
  usd_per_eur_2025: 1.1293
  usd_per_gbp_2025: 1.3184
  krw_per_usd_2q26: 1500.58
  basis: >-
    ECB reference rates, monthly averages: 2025 mean of 12 months (USD/EUR 1.1293,
    GBP/EUR 0.8566 -> USD/GBP 1.3184); Apr-Jun 2026 KRW/EUR 1745.55 / USD/EUR 1.1633.
  source: ecb_exr

anchors:
  - id: roblox_q3_2026
    name: Roblox
    app_id: "431946152"
    role: calibrate
    country: us
    ranks: {"2026-11-13": 3, "2026-11-14": 4}
    rank_basis: studio-pulse radar, Apple legacy RSS US Top Grossing Games (public chart)
    amount: 1697.0e6
    currency: USD
    metric: bookings, worldwide, all platforms
    period: {start: "2026-07-01", end: "2026-09-30"}
    quote: "bookings were $1.7 billion, surpassing the high end of our guidance range"
    sources: [roblox_q3_2026_letter, roblox_q3_2026_10q, roblox_fy2025_10k]
    factors:
      - {name: app_store_share, range: [0.26, 0.32],
         basis: "FY2025 10-K: 29% of revenue from Robux sold through the Apple App Store (FY2024: 30%)"}
      - {name: us_canada_share, range: [0.52, 0.62],
         basis: "Q3 2026 10-Q: United States and Canada $895M, 57% of revenue (applied to App Store bookings: assumption)"}
      - {name: us_of_us_canada, range: [0.85, 0.92], basis: assumption}
    caveat: App Store revenue includes iPad and Mac; the chart is the iPhone list.

  - id: disney_solitaire_q3_2026
    name: Disney Solitaire
    app_id: "6475757306"
    role: calibrate
    country: us
    ranks: {"2026-11-13": 35, "2026-11-14": 32}
    rank_basis: studio-pulse radar, Apple legacy RSS US Top Grossing Games (public chart)
    amount: 111.2e6
    currency: USD
    metric: revenue, worldwide, all channels (Playtika, SuperPlay studio)
    period: {start: "2026-07-01", end: "2026-09-30"}
    quote: "Disney Solitaire revenue of $111.2 million decreased (21.9)% sequentially"
    sources: [playtika_q3_2026]
    factors:
      - {name: store_share, range: [0.45, 0.70],
         basis: "Playtika Q3 2026: direct-to-consumer $275.1M of $673.8M revenue (59.2% elsewhere); per-title split not disclosed"}
      - {name: app_store_of_store, range: [0.55, 0.75],
         basis: "assumption; worldwide 2025 game IAP: App Store $52.5B vs Google Play $30B (63.6%, Sensor Tower)"}
      - {name: us_share, range: [0.40, 0.75], basis: assumption (not disclosed)}

  - id: bingo_blitz_q3_2026
    name: Bingo Blitz
    app_id: "529996768"
    role: calibrate
    country: us
    ranks: {"2026-11-13": 72, "2026-11-14": 71}
    rank_basis: studio-pulse radar, Apple legacy RSS US Top Grossing Games (public chart)
    amount: 133.0e6
    currency: USD
    metric: revenue, worldwide, all channels (Playtika)
    period: {start: "2026-07-01", end: "2026-09-30"}
    quote: "Bingo Blitz revenue of $133.0 million decreased (8.3)% sequentially"
    sources: [playtika_q3_2026, playtika_fy2025_10k]
    factors:
      - {name: store_share, range: [0.35, 0.70],
         basis: "Playtika Q3 2026: 59.2% of revenue outside its own payment channel; FY2025 10-K: 66.3% through Apple's and Google's billing; per-title split not disclosed"}
      - {name: app_store_of_store, range: [0.55, 0.75],
         basis: "assumption; worldwide 2025 game IAP App Store share 63.6% (Sensor Tower)"}
      - {name: us_share, range: [0.40, 0.75], basis: assumption (not disclosed)}

  - id: lineage_m_2q26
    name: Lineage M
    app_id: ["1474589366", "1128255542"]
    role: validate
    country: kr
    ranks: {}   # read from the radar's own KR Top Grossing snapshots when they exist
    rank_basis: studio-pulse radar snapshots of the KR Top Grossing Games list
    amount: 117333.0e6
    currency: KRW
    metric: revenue, all regions (NCSOFT IR, mirrored)
    period: {start: "2026-04-01", end: "2026-06-30"}
    figure: "KRW 117,333 million in 2Q26 (1Q26: 112,805; 2Q25: 127,908)"
    sources: [ncsoft_2q26]
    factors:
      - {name: korea_share, range: [0.48, 0.85],
         basis: "NCSOFT 2Q26 revenue by region: Korea 48% (company); Lineage M is Korea-centred (upper end: assumption)"}
      - {name: app_store_share_kr, range: [0.15, 0.30],
         basis: "Sensor Tower: Android 73.6% (H1 2025) and 75% (H2 2025) of Korean game revenue; widened for an adult MMORPG (assumption)"}

skipped:
  - {name: "June's Journey (Playtika, Q3 2026 $76.6M)", why: "not in the US Top Grossing top 100 on 13-14 Nov 2026; country split not disclosed"}
  - {name: "Garena / Free Fire (Q3 2026 bookings $890.0M)", why: "company-level; Free Fire's share and its iOS share not disclosed"}
  - {name: "Supercell (FY2025 $3.01B)", why: "several games, no per-game split"}
  - {name: "Royal Match, Monopoly GO!", why: "no company-disclosed revenue; public figures are analytics-firm estimates"}

market_size:   # mobile game consumer spend per country, latest full year
  us: {amount: 26.7e9, currency: USD, period: "2025", ios_share: [0.55, 0.75],
       ios_basis: assumption (no public US store split found),
       basis: "Sensor Tower via ESA: US mobile game spending reached $26.7 billion in 2025", source: esa_2025}
  jp: {amount: [10.0e9, 11.0e9], currency: USD, period: "12 months to Jul 2026 (and to Jul 2025)",
       ios_share: [0.50, 0.70], ios_basis: "Sensor Tower: iOS accounts for the majority of consumer spending",
       basis: "Sensor Tower: over USD $10 billion (12 months to Jul 2026); $11B a year earlier", source: st_japan_2026}
  kr: {amount: 5.2e9, currency: USD, period: "2025 (H1 ~$2.4B + H2 ~$2.8B)", ios_share: [0.25, 0.264],
       ios_basis: "Sensor Tower: Android 73.6% (H1 2025) and 75% (H2 2025) of revenue",
       basis: "Sensor Tower Korea half-year recaps 2025", source: st_korea_2025}
  de: {amount: 2596.0e6, currency: EUR, period: "2025", ios_share: [0.40, 0.65], ios_basis: assumption,
       basis: "game (German games industry association), YouGov/Sensor Tower: in-app purchases EUR 2,596M of EUR 2,671M", source: game_de_2026}
  gb: {amount: 1.88e9, currency: GBP, period: "2025", ios_share: [0.50, 0.75], ios_basis: assumption,
       basis: "ERA via PocketGamer.biz: mobile games revenue GBP 1.88bn (+8.8%)", source: era_2025}
  fr: {amount: 1.792e9, currency: EUR, period: "2025", ios_share: [0.40, 0.65], ios_basis: assumption,
       basis: "SELL: mobile ecosystem EUR 1.792bn in 2025 (+11%)", source: sell_2025}
  tr: {amount: 347.0e6, currency: USD, period: "2025", ios_share: [0.25, 0.45], ios_basis: assumption,
       gross_up: [1.0, 1.43], gross_basis: "AppMagic wording 'generating $347M for developers' suggests net of store fees",
       basis: "AppMagic Turkiye Mobile Gaming Landscape 2026: mobile gaming revenue $347M (+6%)", source: appmagic_tr_2026}
  # ca, au, br: no public country figure found on 14 Nov 2026 -> no revenue estimate there.

sources:
