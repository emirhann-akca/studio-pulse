  garg_telang_2013: {title: "Garg & Telang, Inferring App Demand from Publicly Available Data, MIS Quarterly 37(4), 2013", url: "https://aisel.aisnet.org/misq/vol37/iss4/14", note: "exponents read in the May 2012 working paper (SSRN 1924044): grossing iPhone 0.860, iPad 0.886; paid downloads 0.944; free downloads 0.616; Apple top-200 lists Apr-May 2011"}
  chevalier_goolsbee_2003: {title: "Chevalier & Goolsbee, Measuring Prices and Price Competition Online (NBER w9085)", url: "https://www.nber.org/papers/w9085.pdf", note: "ln(rank) on ln(sales) theta = 1.2, i.e. sales ~ rank^-0.83 (books)"}
